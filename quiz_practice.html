e Code \u2013 \u201cYour code\u2019s new collaborator\u201d\nCursor \u2013 \u201cBuilt to make you extraordinarily productive, Cursor is the best way to code with AI\u201d\nGitHub Copilot \u2013 \u201cYour AI pair programmer\u201d\nLovable \u2013 \u201cCreate apps and websites by chatting with AI\u201d"}, {"id": "w2-s42", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 42", "section": null, "title": "Model Context Protocol (MCP)", "text": "Model Context Protocol (MCP)\nAn open standard for interfaces to access add-ons like:\nTools\nData (including databases)\nAPIs\nSome popular MCPs for vibe coding:\nContext7 for up-to-date coding documentation\nPlaywright MCP or Chrome DevTools for browser automation\nComfy MCP for image/video/audio/3D generation\nSee the MCP Market Leaderboard for more"}, {"id": "w2-s5", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 5", "section": null, "title": "Training Data", "text": "Training Data\nModels must be pre-trained on large corpuses of data\nThese data may be either open or closed\nFor fully open examples, see Olmo from Ai2 and NVIDIA Nemotron\nSome model providers have been accused of copyright infringement\nSee The New York Times Company v. Microsoft Corp., OpenAI, \u2026\nModels will often include a \u201cknowledge cutoff date\u201d to clarify how up-to-date their training data is (or isn\u2019t)"}, {"id": "w2-s6", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 6", "section": null, "title": "Model Size and \u201cIntelligence\u201d", "text": "Model Size and \u201cIntelligence\u201d\nModels come in various parameter sizes\ne.g., 30B, 671B\nLarger models tend to perform better, but so do more recent models\nConsider size vs. knowledge vs. performance vs. cost tradeoffs"}, {"id": "w2-s7", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 7", "section": null, "title": "Benchmark Evaluation", "text": "Benchmark Evaluation\nSWE-Bench Pro\nDeepSWE\nTerminal-Bench\nAgents\u2019 Last Exam\nAutomationBench\nArtificial Analysis Intelligence Index\nSee the AAII website for an additional chart for \u201cSpeed.\u201d"}, {"id": "w2-s8", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 8", "section": null, "title": "Context, Context, Context\u2026", "text": "Context, Context, Context\u2026\nBesides \u201cintelligence,\u201d one must consider context, or how much text (or other information) a model can access while generating subsequent tokens\nProvides \u201cworking memory,\u201d i.e., how much the model can remember and work with before forgetting\nMeasured in tokens (i.e., text chunks) and referred to as context length or context window\nCovers both input and output tokens\nTLDR: more context = better (especially for coding)"}, {"id": "w2-s9", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 9", "section": null, "title": "Managing Long Context", "text": "Managing Long Context\nAgentic AI involves long conversations and thus long context\nContext must be compressed, compacted, summarized, and/or pruned over time\nModel accuracy and performance degrades by context length (e.g., see NVIDIA RULER)"}, {"id": "w3-s1", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 1", "section": null, "title": "MBAX 6418Prompt Engineering", "text": "MBAX 6418Prompt Engineering\nDavid Dobolyi, PhD\nAssistant Professor\nStone Family Faculty Scholar\ndavid.dobolyi@colorado.edu"}, {"id": "w3-s10", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 10", "section": null, "title": "JSON Format", "text": "JSON Format\n[\n{\"role\": \"system\", \"content\": \"You are a helpful assistant.\"},\n{\"role\": \"user\", \"content\": \"What is a prompt?\"}\n]\nExample\nJinja Template\n{% for message in messages %}\n<|im_start|>{{ message['role'] }}\n{{ message['content'] }}<|im_end|>\n{% endfor %}\n<|im_start|>assistant\nChatML Formatted Prompt\n<|im_start|>system\nYou are a helpful assistant.<|im_end|>\n<|im_start|>user\nWhat is a prompt?<|im_end|>\n<|im_start|>assistant"}, {"id": "w3-s11", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 11", "section": null, "title": "Why This Matters\u2026", "text": "Why This Matters\u2026\nPrompting goes beyond simply sending messages\nKnowing more about how Hermes Agent processes your prompts provides insight into what you can control, allowing for changes in response quality\nFor example, as a user, you can alter Hermes\u2019 system prompt\u2014including its tone, personality, communication style, etc.\u2014by editing your SOUL.md file"}, {"id": "w3-s12", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 12", "section": null, "title": "Conclusion", "text": "Conclusion\nDespite all the complexity, most aspects of prompt processing can be left to Hermes Agent and/or other tools to handle for you invisibly\nThe single most important thing you can do when prompting \u2013 be that sending messages to Hermes or to a model directly via an API request \u2013 is to tailor the user prompt to your task, which we cover in the next section"}, {"id": "w3-s13", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 13", "section": null, "title": "Prompting for Different Tasks", "text": "Prompting for Different Tasks"}, {"id": "w3-s14", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 14", "section": null, "title": "Same Prompt\u2026Different Output", "text": "Same Prompt\u2026Different Output\nThe same prompt can produce a different output for a variety of reasons, including differences in:\nModels (e.g., ChatGPT 5.6 Sol vs. Luna)\nReasoning effort (e.g., None vs. High)\nSampling parameters (e.g., temperature, top-p, top-k, seed)\nSystem instructions\nConversation history and other context (e.g., tool results)\nChat templates and/or prompt formatting\nServing implementation, model quantization, hardware, etc."}, {"id": "w3-s15", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 15", "section": null, "title": "Your Role", "text": "Your Role\nDespite these limitations, how you define and structure your prompt is the most critical aspect of maximizing output quality for a task\nA poorly-written prompt can make a strong model underperform\nA well-written prompt can make a weak model overperform (within the limits of model knowledge/capabilities)\nThis section focuses on the anatomy of a good prompt"}, {"id": "w3-s16", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 16", "section": null, "title": "Markdown", "text": "Markdown\nPrompts are often written in Markdown format (created by John Gruber in 2004) to help provide text-based structure that LLMs understand\nVarious cheat sheets and guides exist that can help with basic syntax\nMarkdown files use the .md extension\nSource:\u00a0Markdown Guide, Matt Cone,\u00a0CC BY-SA 4.0"}, {"id": "w3-s17", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 17", "section": null, "title": "Research on Prompt Engineering", "text": "Research on Prompt Engineering\nThere are many rules-of-thumb regarding how prompts should be engineered, although outcomes often vary by task and setting\nFor a recent literature review regarding prompt engineering from an educational perspective, see:\nPrompt engineering in higher education: a systematic review to help inform curricula (Lee & Palmer 2025)"}, {"id": "w3-s18", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 18", "section": null, "title": "Source:\u00a0Lee & Palmer (2025, pg. 14)", "text": "Source:\u00a0Lee & Palmer (2025, pg. 14)"}, {"id": "w3-s19", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 19", "section": null, "title": "Example", "text": "Example\nYou are an academic expert. Please follow all the instructions very carefully.\n### Consider the following definition of banter:\n- Banter is any teasing that runs along a continuum of bonding to biting.\n- The banter must be in the dialogue (or a vocalization), not the prose.\n- Humorous non-utterances do not count as banter.\n### Task Overview\nYou will be given a dialogue pair and asked to determine if banter is present or not. The banter may be present in either or both parts of the dialogue pair, if present at all.\n### You will make a determination if banter is present or not using this response scale:\n0. Banter is not present\n1. Banter is present\n### Dialogue Pair\n# Part A:\n<inserted by script>\n# Part B:\n<inserted by script>\n### Your Task\nAnswer the following question immediately by stating one response from the scale above verbatim.\nYOUR RESPONSE MUST MATCH THE SCALE EXACTLY WITHOUT ALTERATIONS, INCLUDING THE SCALE RESPONSE NUMBER.\nDoes the dialogue pair contain banter?\nSource:\u00a0Dobolyi, K., Tamburrino, S., Borden, Z., & Faruque (2026, pgs. 58-59)\n1. Define role: Explain to the AI agent who it is\n2. Provide background: Inform AI agent of context\n3. Define objectives: Explain to the AI agent your goals\n4. Set parameters: Allow or limit tolerances\n5. Be precise: Ensure your instruction or question is concise and explicit\n6. Specify format: Describe or even provide a template"}, {"id": "w3-s2", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 2", "section": null, "title": "Prompts and Templates", "text": "Prompts and Templates\nPrompting for Different Tasks\nPrompting with Hermes Agent\nClass Exercise\n2\nTopics"}, {"id": "w3-s20", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 20", "section": null, "title": "Prompting for Basic Tasks", "text": "Prompting for Basic Tasks\nTasks such as the classification example on the previous slide require clarity and precision\nPrompting the model repeatedly on a single piece of data can produce higher quality results than asking several questions at once\nTry using different \u201cshotting\u201d techniques to improve results:\nZero-shot provides no examples when asking for a response\nOne-shot and few-shot offer one or many examples, respectively\nAlso consider positive vs. negative examples and contrastive prompting (Gao & Das 2024)"}, {"id": "w3-s21", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 21", "section": null, "title": "Few-Shot Example", "text": "Few-Shot Example\n\u2026\n### Examples\nHere are three illustrative examples of banter:\n## Example 1\n# Part A:\n\"Must you rattle those dishes so loudly?\" he complained, as Merlin set out his breakfast tray on the dining table. \"It\u2019s like being served by a stampede of wild horses.\"\n# Part B:\n\"So sorry, sire,\" Merlin said, making sure to let the milk jug clatter as he set it down. \"How inconsiderate of me. It\u2019s just so hard to keep hold of all these things with my clumsy hooves.\u201d\n## Example 2\n# Part A:\n\"It\u2019s only natural, Zombie Boy.\" She turns to take in the rest of the room. \"So what\u2019s this, like the world\u2019s saddest breakfast club?\"\n# Part B:\nJason and Tim both wince at that, but Damian just sits up straight and takes a sip of his cocoa with a smirk of amusement. \"It is now that you\u2019re here, Brown,\" he quips.\n## Example 3\n# Part A:\nDick rolls his eyes, but gets one out of the cupboard anyway. \"I wouldn\u2019t have hurled.\" He hands Jason the metal bowl. \"Also I hate green pepper.\"\n# Part B:\n\"Sorry, what was that?\" Jason mocks, still chopping away. \"Extra pepper you say?\" He dumps a generous handful into the bowl with the onion, receiving a very unamused look from his brother in return.\n\u2026\nSource:\u00a0Dobolyi, K., Tamburrino, S., Borden, Z., & Faruque (2026, pgs. 58-59)"}, {"id": "w3-s22", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 22", "section": null, "title": "Structured Output", "text": "Structured Output\nPrompting a model to answer a specific way or to use a specific scale does not guarantee adherence\nIf adherence is key (e.g., classification tasks, downstream use), consider structured outputs, which dictate exactly how a model must respond\nPydantic\nclass ReviewAnalysis(BaseModel):\nsentiment: Literal[\"neg\", \"pos\"]\nconfidence: float\ntopics: list[str]\nJSON\n{\n\"sentiment\": \"neg\",\n\"confidence\": 0.92,\n\"topics\": [\"returns\", \"shipping\"]\n}"}, {"id": "w3-s23", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 23", "section": null, "title": "Other Prompting Techniques", "text": "Other Prompting Techniques\nSource:\u00a0Walter (2024, pg. 15)"}, {"id": "w3-s24", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 24", "section": null, "title": "Prompting Complex Tasks (e.g., Coding)", "text": "Prompting Complex Tasks (e.g., Coding)\nSuccessfully accomplishing a complex task like coding requires step-by-step instruction (e.g., numbered lists)\nSteps should be sequential\nWhile multiple aspects can be worked in a single prompt, they may interfere with each other if they are not independent\nA single, giant prompt can lead to missed or skipped steps\nBe precise and do your research beforehand, e.g.,\nWhat language do you want to code in?\nWhat packages do you want to use?"}, {"id": "w3-s25", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 25", "section": null, "title": "Source:\u00a0Lee & Palmer (2025, pg. 14)", "text": "Source:\u00a0Lee & Palmer (2025, pg. 14)"}, {"id": "w3-s26", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 26", "section": null, "title": "Planning and Goals", "text": "Planning and Goals\nWorking with a model to develop a plan (e.g., plan first\u2026no code yet; \u201ctalk only\u201d) or to establish goals can help by:\nBreaking down a complex task into smaller steps (e.g., subgoals)\nProviding a contract for you to analyze what the model did \u2013 and didn\u2019t \u2013 do after the fact\nAllowing for easier tracking of what\u2019s already been done, which also helps understand what comes next\nPlans/goals should include things that need to be done and things that shouldn\u2019t be done (i.e., constraints)\nHermes (with a good model) may even ask you to clarify"}, {"id": "w3-s27", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 27", "section": null, "title": "Auditing, Verification, and GitHub", "text": "Auditing, Verification, and GitHub\nNever trust anything your agent does\nYou must review, audit, check, verify\nAsk your model to summarize everything it did in the last turn(s) and commit this record to GitHub\nMaintaining code on GitHub helps provide context for future work as well as recovery from mistakes/problems (e.g., by reverting commits)\nSources:\u00a0Acuna, K. (2015, March 31); Nolan, C. (2014)\n\u201cWhat\u2019s your trust setting, TARS?\nLower than yours apparently...\u201d"}, {"id": "w3-s28", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 28", "section": null, "title": "Prompting with Hermes Agent", "text": "Prompting with Hermes Agent"}, {"id": "w3-s29", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 29", "section": null, "title": "Hermes Agent Commands", "text": "Hermes Agent Commands\nBeyond just typing prompts, Hermes provides several commands to help manage more complex tasks, including:\n/prompt \u2013 Compose your next prompt in $EDITOR (markdown), then send it (aka /compose)\n/queue \u2013 Queue a prompt for the next turn (doesn\u2019t interrupt)\n/steer \u2013 Inject a message after the next tool call without interrupting\n/goal \u2013 Set a standing goal Hermes works on until achieved\n/subgoal \u2013 Add or manage extra criteria on the active goal\n/plan \u2013 Write a markdown implementation plan\u2026without executing anything\n/kanban \u2013 Multi-profile collaboration board (tasks, links, comments)\nThe following slides present key summaries from pg. 14 of Lee & Palmer (2025)"}, {"id": "w3-s3", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 3", "section": null, "title": "Prompts and Templates", "text": "Prompts and Templates"}, {"id": "w3-s30", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 30", "section": null, "title": "Hermes and Projects", "text": "Hermes and Projects\nTo help organize, use the projects feature in the desktop application (see slide notes) or ask Hermes to create a project on the command line interface (CLI)\nMake use of Hermes\u2019 context files including:\nHERMES.md \u2013 Project instructions (highest priority)\nAGENTS.md \u2013 Project instructions, conventions, architecture\nCLAUDE.md \u2013 Claude Code context files (also detected)\nSOUL.md \u2013 Global personality and tone customization"}, {"id": "w3-s31", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 31", "section": null, "title": "Advice from Hermes\u2019 Docs", "text": "Advice from Hermes\u2019 Docs\nSource:\u00a0Hermes Agent Docs"}, {"id": "w3-s32", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 32", "section": null, "title": "Hermes Learns from and Remembers You", "text": "Hermes Learns from and Remembers You\nAs you use Hermes, it will start making notes about you via persistent memory files, including:\nMEMORY.md \u2013 Agent\u2019s personal notes, including environment facts, conventions, things learned\nUSER.md \u2013 User profile, including your preferences, communication style, expectations\nHermes comes with out-of-the-box skills to help solve tasks, but it can also learn new ones as you work with it (automatically or manually):\n/skills \u2013 Search, install, inspect, or manage skills\n/learn \u2013 Learn a reusable skill from anything you describe"}, {"id": "w3-s33", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 33", "section": null, "title": "Class Exercise", "text": "Class Exercise"}, {"id": "w3-s4", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 4", "section": null, "title": "Prompts", "text": "Prompts\nPrompts consist of text and/or multimodal content (e.g., images, audio, video) provided to a model to guide its behavior and outputs\nFor example, a user prompt to Hermes Agent might be as simple as: \u201cWhat is a prompt?\u201d"}, {"id": "w3-s5", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 5", "section": null, "title": "How Prompts are Processed", "text": "How Prompts are Processed\nAgent harnesses such as Hermes Agent process your prompt through a stack of context\nThis stack includes not only the user prompt (e.g., \u201cWhat is a prompt?\u201d), but also additional layers including:\nSystem prompt\nConversation history\nRetrieved context/memory\nTool schemas (including tool name, parameters, etc.)\nTool results"}, {"id": "w3-s6", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 6", "section": null, "title": "From Prompt to Model Input", "text": "From Prompt to Model Input\nThe full prompt is then sent to a serving framework in a format such as JavaScript Object Notation (JSON) to generate a response:\n{\n\"messages\": [\n{\"role\": \"system\", \"content\": \"...Hermes Agent instructions...\"},\n{\"role\": \"user\", \"content\": \"What is a prompt?\"}\n],\n\"tools\": [\n{\"name\": \"web_search\", \"description\": \"Search the web\", ...}\n],\n...\n}\nThe full prompt is then sent to a serving framework in a format such as JavaScript Object Notation (JSON) to generate a response:\n{\n\"messages\": [\n{\"role\": \"system\", \"content\": \"...Hermes Agent instructions...\"},\n{\"role\": \"user\", \"content\": \"What is a prompt?\"}\n],\n\"tools\": [\n{\"name\": \"web_search\", \"description\": \"Search the web\", ...}\n],\n...\n}"}, {"id": "w3-s7", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 7", "section": null, "title": "Model Prompt Formatting/Templates", "text": "Model Prompt Formatting/Templates\nPrompt formatting/templates\u00a0define how this content is structured and presented to the model, including:\nRoles (e.g., system, user, assistant)\nSeparators (e.g., \\n\\n, ###)\nSpecial tokens (e.g., <|user|>, <|im_start|>, <|eot_id|>)"}, {"id": "w3-s8", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 8", "section": null, "title": "Chat Markup Language (ChatML)", "text": "Chat Markup Language (ChatML)\n<|im_start|>system\nYou are a helpful assistant.<|im_end|>\n<|im_start|>user\nWhat is a prompt?<|im_end|>\n<|im_start|>assistant\nLlama 3 Template\n<|begin_of_text|><|start_header_id|>system<|end_header_id|>\nYou are a helpful assistant.<|eot_id|><|start_header_id|>user<|end_header_id|>\nWhat is a prompt?<|eot_id|><|start_header_id|>assistant<|end_header_id|>\nTemplate Examples"}, {"id": "w3-s9", "doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "loc": "Week 3, slide 9", "section": null, "title": "Conversion", "text": "Conversion\nDifferent models have different templates\nServing frameworks (e.g., vLLM) apply a particular model\u2019s chat template to your messages for you\nModels often include a Jinja file to facilitate this conversion, including multimodal content, tool-calling conventions, etc."}, {"id": "w4-s1", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 1", "section": null, "title": "David Dobolyi, PhD", "text": "David Dobolyi, PhD\nAssistant Professor\nStone Family Faculty Scholar\ndavid.dobolyi@colorado.edu\nMBAX 6418Serving and Debugging"}, {"id": "w4-s10", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 10", "section": null, "title": "Application Programing Interface (API)", "text": "Application Programing Interface (API)\nApplication programming interfaces (APIs) provide a structured way for software applications to talk to each other\nYour app sends a request and receives a response\nWe\u2019ll use APIs to allow our apps to do things like:\nTalk to large language models (LLMs) to generate text, power chatbots, classify data, etc.\nInterpret or generate images\nTranscribe or generate audio/video\nSearch the web via search APIs or tools (including MCP)"}, {"id": "w4-s11", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 11", "section": null, "title": "OpenAI API", "text": "OpenAI API\nFor example, OpenAI provides developers an API Platform with all kinds of models\nYou pay per request (e.g., input/output price per million tokens, or MTok)\nThe OpenAI Python API library is one way to connect"}, {"id": "w4-s12", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 12", "section": null, "title": "OpenAI-Compatible Endpoints", "text": "OpenAI-Compatible Endpoints\nThe OpenAI Python API library is designed to work with OpenAI models, but you can also use it to talk to OpenAI-compatible endpoints\nThese endpoints communicate the same way as the official OpenAI API Platform, but can be hosted elsewhere\nFor example, we are already using a free, OpenAI-compatible endpoint for our class LLM (served via vLLM):\nBase URL: http://dobolyi.com:9000/v1\nAPI Key: 6418\nModel Name: DeepSeek-V4-Flash-0731"}, {"id": "w4-s13", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 13", "section": null, "title": "More Endpoints", "text": "More Endpoints\nThroughout this class, I will provide more endpoints to help with various tasks\nFor example, here is a new endpoint we can use for augmenting vision and for classification tasks:\nBase URL: http://dobolyi.com:9001/v1\nAPI Key: 6418\nModel Name: cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit\nWe\u2019ll also talk about models for embeddings, multimodal generation, etc. in future classes"}, {"id": "w4-s14", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 14", "section": null, "title": "Adding a Vision Model to Hermes Agent", "text": "Adding a Vision Model to Hermes Agent\nHermes Desktop: Go to Settings \u2794 Providers \u2794 Custom Endpoints, fill out the screen as shown on the right (be sure to uncheck \u201cUse for new chats\u201d), click \u26a1 Test followed by \ud83d\udcbe Save\nHermes CLI: In the terminal, run hermes model, find \u201cCustom endpoint (enter URL manually)\u201d and follow the instructions\nOr ask Hermes to set up a new vision model provider for you"}, {"id": "w4-s15", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 15", "section": null, "title": "Changing the Auxiliary Vision Model", "text": "Changing the Auxiliary Vision Model\nHermes Desktop: Go to Settings \u2794 Model, find \u201cVision\u201d under \u201cAuxiliary models\u201d, click Change and fill out the screen as shown on the right (be sure to click Apply)\nHermes CLI: In the terminal, run hermes model, find \u201cConfigure auxiliary models\u2026\u201d and follow the instructions"}, {"id": "w4-s16", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 16", "section": null, "title": "Adding Providers / Subscriptions", "text": "Adding Providers / Subscriptions\nYou can also add subscriptions (e.g., Codex) to Hermes Agent\nHermes Desktop: Go to Settings \u2794 Providers \u2794 Accounts, click \u201cOther providers\u201d, choose an option, and follow the instructions\nHermes CLI: In the terminal, run hermes model, select an option (e.g., \u201cOpenAI \u25b8 \u2026) and follow the instructions\nOr ask Hermes for help"}, {"id": "w4-s17", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 17", "section": null, "title": "Debugging", "text": "Debugging"}, {"id": "w4-s18", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 18", "section": null, "title": "Bugs and Bug Reports", "text": "Bugs and Bug Reports\nWhile you build and test your app, your code will invariably contain bugs, which are errors in the software that cause it to fail or not work as intended\nTo fix bugs, you need to create a thorough bug report, which helps document, reproduce, and ultimately fix each issue\nWarning! Just because an agent says a bug was fixed doesn\u2019t mean it\u2019s true! You must check!"}, {"id": "w4-s19", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 19", "section": null, "title": "Writing Useful Bug Reports", "text": "Writing Useful Bug Reports\nKey Questions\nWhat is the problem?\nWhere in the app does it happen?\nWhat did you expect to happen?\nWhat actually happened?\nHow do you reproduce it?\nSupporting Evidence\nWas there an error message?\nCan you provide a screenshot?\nDoes it happen every time or only sometimes?"}, {"id": "w4-s2", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 2", "section": null, "title": "Building, Serving, and Sharing", "text": "Building, Serving, and Sharing\nIncorporating APIs\nDebugging\nGitHub\n2\nTopics"}, {"id": "w4-s20", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 20", "section": null, "title": "Working with Hermes to Fix Bugs", "text": "Working with Hermes to Fix Bugs\nProvide each bug report to Hermes and ask for a targeted, testable fix\nVerify every fix by trying your reproduction steps: no matter what Hermes claims, test, retest, and test again\nCheck related features: fixing one bug can introduce others\nTo make repeated testing easier, consider asking Hermes for automated tests (as opposed to your own manual tests), including:\nUnit tests \u2013 tests for small, specific parts of your software\nSmoke tests \u2013 quick/inexpensive tests that ensure your app starts/runs and the basic functions work\nEnd-to-end tests \u2013 perform and verify a complete workflow"}, {"id": "w4-s21", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 21", "section": null, "title": "GitHub", "text": "GitHub"}, {"id": "w4-s22", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 22", "section": null, "title": "What is GitHub?", "text": "What is GitHub?\nGitHub\u2019s first Start Your Journey tutorial asks, \u201cWhat is GitHub?\u201d:\n\u201cGitHub is a platform that supports your entire software development process, from planning work to deploying and operating software.\u201d\nGitHub is built on the open-source version control system called Git, which records changes to project files\nWe\u2019ll use Git and GitHub primarily to:\nManage our code\nRecover earlier versions\nCollaborate with others\nAll of this will happen inside a repository (or repo), which stores a project\u2019s files, its history, privacy/collaboration settings, etc."}, {"id": "w4-s23", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 23", "section": null, "title": "Working with GitHub", "text": "Working with GitHub\nBefore creating a repo on GitHub, you need an account:\nhttps://github.com/signup\nWith an account, you can create your first repo via the website or locally using the GitHub Desktop application (which you can later push to GitHub)\nOr just ask Hermes:\n\u201cHelp me connect to my GitHub account\u201d\n\u201cCreate and connect a new GitHub repo for this project before we begin\u201d"}, {"id": "w4-s24", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 24", "section": null, "title": "Hermes and GitHub", "text": "Hermes and GitHub\nIf you ask it to (e.g., \u201cLet\u2019s use GitHub for version control\u201d), Hermes will take care of Git/GitHub on your behalf, including common commands:\ngit init \u2013 create a new local repository\ngit clone \u2013 copy an existing repository to your computer\ngit status \u2013 show local changes and what\u2019s ready to commit\ngit add \u2013 select changes to include in the next commit\ngit commit \u2013 record selected changes as a checkpoint\ngit push \u2013 send commits to a remote repository, e.g., GitHub\ngit revert \u2013 create a new commit that reverses a previous commit\ngit pull \u2013 retrieve/incorporate remote changes to your local copy\ngit diff \u2013 compare changes between file versions"}, {"id": "w4-s25", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 25", "section": null, "title": "Commits", "text": "Commits\nAsk Hermes to create a commit with each meaningful change and consider grouping related changes into checkpoints, especially when debugging or experimenting with user interface (UI) styling:\n\u201cReview these changes and commit them with a clear summary\u201d\nHermes will write commit messages for you which include:\nSummary (Subject) \u2013 a summary of changes (50 characters or fewer recommended)\nDescription (Body) \u2013 optional details of what changed and why\nAsk Hermes to push regularly, or specify when to wait:\n\u201cPush all of the latest commits\u201d or\u2026\n\u201cHold off on pushing until I say so\u201d"}, {"id": "w4-s26", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 26", "section": null, "title": "Reverting Commits", "text": "Reverting Commits\nCommits are useful for tracking and recovering from mistakes\nIf a new bug appears, work with Hermes to review your commit history on GitHub to help identify which change introduced it\nAsk Hermes to revert the relevant commit, undoing the changes:\n\u201cThis worked before the last commit: find and undo what broke it\u201d\nTest again to confirm the problem is actually resolved"}, {"id": "w4-s27", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 27", "section": null, "title": "README.md", "text": "README.md\nWhen you create a repo or make your first commit, include a README.md, which describes the project, how to set it up, and how to use it\nUpdate this file as your project changes\nHermes will typically create this file for you, but you can also ask it to directly:\n\u201cCreate a README.md explaining this project and how to use it\u201d"}, {"id": "w4-s28", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 28", "section": null, "title": "Branching and Merging", "text": "Branching and Merging\nUse branch to create separate lines of work in a repo to safely:\nDevelop a new feature\nFix a bug\nExperiment\nThe default branch is typically called main, and it holds the primary version you build from\nYou can create and name other branches (e.g., dev)\nUse merge to combine changes across branches (e.g., dev into main)\nAsk Hermes:\n\u201cCreate a branch for this feature and test it before merging into main\u201d"}, {"id": "w4-s29", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 29", "section": null, "title": "Collaboration: Issues and PRs", "text": "Collaboration: Issues and PRs\nCreate issues to provide a record of tasks, discussions, and progress, giving you, collaborators, and Hermes useful context\nCreate pull requests (PRs) to propose changes you want to merge (e.g., fixes to issues), allowing for review, discussion, and tracking\nCollaborators can suggest revisions before you merge\nAsk Hermes:\n\u201cCreate an issue from this bug report\u201d\n\u201cOpen a pull request for this feature and summarize the changes and testing\u201d"}, {"id": "w4-s3", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 3", "section": null, "title": "Building, Serving, and Sharing", "text": "Building, Serving, and Sharing"}, {"id": "w4-s4", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 4", "section": null, "title": "Building", "text": "Building\nLet\u2019s create a small web app, add features (including one with AI), and share it\nWe\u2019ll also commit it to GitHub for version control\nStarter prompt:\n\u201cbuild a python app using gradio for a pizza ordering website where customers can customize their pizzas with things like toppings, size, crust, etc.\u201d\nMade with Hermes Agent and GPT-6 Astra"}, {"id": "w4-s5", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 5", "section": null, "title": "Choosing an Interface", "text": "Choosing an Interface\nWe have many interface options, but for Python, Gradio and Streamlit are good, high abstraction options (i.e., they handle many of the technical details for us)"}, {"id": "w4-s6", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 6", "section": null, "title": "Components and Widgets", "text": "Components and Widgets\nGradio and Streamlit provide prebuilt user interface (UI) elements (e.g., buttons, sliders, and text inputs) to help you quickly build interactive Python apps:\nGradio Components\nStreamlit Elements/Widgets"}, {"id": "w4-s7", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 7", "section": null, "title": "Serving", "text": "Serving\nGradio provides easy serving without web hosting\nYou can open your app locally using the default port, 7860:\nhttp://127.0.0.1:7860\nhttp://localhost:7860\nAdding share=True to launch() provides a temporary link, e.g., 60de1eaeaeb5f2b135.gradio.live/\nYou must keep your computer running so others are able to load your app in their browser"}, {"id": "w4-s8", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 8", "section": null, "title": "Gradio vs. Streamlit vs. \u2026", "text": "Gradio vs. Streamlit vs. \u2026\nGradio is one Python-based option, and Streamlit is another\nBoth have their pros and cons, and each is better at some tasks vs. others\nChatbots, RAG apps, model interfaces, etc.\nUltimately, use whatever you think works (or looks) best for your task (and explore alternatives)"}, {"id": "w4-s9", "doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "loc": "Week 4, slide 9", "section": null, "title": "Incorporating APIs", "text": "Incorporating APIs"}, {"id": "w5-s1", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 1", "section": null, "title": "MBAX 6418Context Engineering and RAG", "text": "MBAX 6418Context Engineering and RAG\nDavid Dobolyi, PhD\nAssistant Professor\nStone Family Faculty Scholar\ndavid.dobolyi@colorado.edu"}, {"id": "w5-s10", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 10", "section": null, "title": "What Is RAG?", "text": "What Is RAG?\nRetrieval-augmented generation (RAG) retrieves relevant information from documents, databases, and other data sources and adds it to a model\u2019s context to help generate a response to a user\u2019s prompt/question"}, {"id": "w5-s11", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 11", "section": null, "title": "Why Use RAG?", "text": "Why Use RAG?\nRAG gives a model access to information beyond its training data, including more recent or private information\nIt selects relevant material from a large collection \u2013 or corpus \u2013 and grounds responses in sources, making answers easier to verify, potentially reducing hallucinations"}, {"id": "w5-s12", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 12", "section": null, "title": "RAG Use Cases", "text": "RAG Use Cases\nRAG lets your app draw on codebases, course materials, private documents, and other information sources to support a variety of tasks"}, {"id": "w5-s13", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 13", "section": null, "title": "Context Optimization", "text": "Context Optimization\nRAG optimizes context by supplying relevant information when the model responds\nFine-tuning adapts the model itself through additional training\u2014a topic we\u2019ll cover later"}, {"id": "w5-s14", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 14", "section": null, "title": "Building a RAG System", "text": "Building a RAG System"}, {"id": "w5-s15", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 15", "section": null, "title": "Semantic Search and Embeddings", "text": "Semantic Search and Embeddings\nRAG often uses semantic search, or search based on meaning, to retrieve info relevant to the user\u2019s question\nSemantic search typically uses embeddings to numerically represent text, images, and other data\nEmbeddings are like coordinatesin high-dimensional space: similar items tend to lie closer together\nVector search compares the question\u2019s embedding with data embeddings to find potential matches"}, {"id": "w5-s16", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 16", "section": null, "title": "Preparing Documents (Docs) for Search", "text": "Preparing Documents (Docs) for Search\nDocs added or updated in the RAG corpus must be prepared for search\nParsing extracts text and structure from each doc\nChunking divides the parsed content of each doc into useful passages while preserving source metadata (e.g., doc name, page number)\nIndexing prepares the chunked passages for both:\nKeyword (lexical) search to find chunks containing matching words\nVector search, which uses embeddings to find chunks with similar meanings"}, {"id": "w5-s17", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 17", "section": null, "title": "Each chunk should contain just enough context to be useful in isolation", "text": "Each chunk should contain just enough context to be useful in isolation\nCommon chunking strategies:\nFixed size \u2013 chunks with a set size, often with overlap\nRecursive \u2013 split at boundaries like paragraphs, then divide oversized chunks at finer boundaries like sentences\nDocument-based \u2013 keep related information together based on structural boundaries such as headings (see example above)\nSemantic \u2013 split based on changing topics or meanings\nChunking: How Much Context Is Enough?"}, {"id": "w5-s18", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 18", "section": null, "title": "Hybrid RAG Pipeline with Reranking", "text": "Hybrid RAG Pipeline with Reranking\nRAG uses information from prepared documents to help an LLM answer the user\u2019s question\nRetrieval finds relevant candidate chunks using both keyword search and vector search in Hybrid RAG\nReranking compares these candidates to the original question and prioritizes which chunks are supplied to the LLM as context"}, {"id": "w5-s19", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 19", "section": null, "title": "Accurate RAG is Challenging", "text": "Accurate RAG is Challenging\nAccurate RAG requires checking both retrieval quality and answer accuracy using questions relevant to your app\nUse the MTEB Leaderboard to shortlist retrieval models and then test them on your own documents and questions"}, {"id": "w5-s2", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 2", "section": null, "title": "Context Engineering", "text": "Context Engineering\nRetrieval Augmented Generation (RAG)\nBuilding a RAG System\nClass Exercise\n2\nTopics"}, {"id": "w5-s20", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 20", "section": null, "title": "RAG Done Right Can Be Valuable", "text": "RAG Done Right Can Be Valuable\nRetrieving relevant evidence early can reduce tokens spent processing irrelevant information, repeating searches, and performing unnecessary reasoning \u2013 and this can save money, improve efficiency, etc."}, {"id": "w5-s21", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 21", "section": null, "title": "Class Exercise", "text": "Class Exercise"}, {"id": "w5-s3", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 3", "section": null, "title": "Context Engineering", "text": "Context Engineering"}, {"id": "w5-s4", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 4", "section": null, "title": "From Prompts to Context", "text": "From Prompts to Context"}, {"id": "w5-s5", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 5", "section": null, "title": "But What Is Context Engineering?", "text": "But What Is Context Engineering?"}, {"id": "w5-s6", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 6", "section": null, "title": "Expanding the Scope", "text": "Expanding the Scope"}, {"id": "w5-s7", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 7", "section": null, "title": "Context Location Matters?", "text": "Context Location Matters?\nHistorically, models suffered from a Lost in the Middle (LITM) effect: LLM accuracy dropped when relevant facts occurred in the middle of input context (Liu et al. 2023)\nSome newer models are more resistant to this effect, but performance still depends on the model, task, and/or surrounding content (e.g., McKinnon 2025; Zhang et al. 2026)"}, {"id": "w5-s8", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 8", "section": null, "title": "Context Is Not Infinite", "text": "Context Is Not Infinite\nEven very large context windows can fill up during long-running or complex tasks\nOlder information may need to be removed or summarized\nAgent harnesses (e.g., Hermes) can manage this for you automatically\nBut what about context engineering for apps you create?"}, {"id": "w5-s9", "doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "loc": "Week 5, slide 9", "section": null, "title": "Retrieval Augmented Generation (RAG)", "text": "Retrieval Augmented Generation (RAG)"}, {"id": "w6-s1", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 1", "section": null, "title": "MBAX 6418Multimodal Generative AI", "text": "MBAX 6418Multimodal Generative AI\nDavid Dobolyi, PhD\nAssistant Professor\nStone Family Faculty Scholar\ndavid.dobolyi@colorado.edu"}, {"id": "w6-s10", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 10", "section": null, "title": "Speech to Text", "text": "Speech to Text\nAutomatic speech recognition (ASR) converts spoken audio into written text\nWhisper large-v3-turbo supports multilingual transcription and segment timestamps, indicating when each passage occurs\nSpeaker diarization labels who spoke when (e.g., \u201cSpeaker 1\u201d vs. \u201cSpeaker 2\u201d), using models like NVIDIA Nemotron-3-Diarization"}, {"id": "w6-s11", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 11", "section": null, "title": "Video Q&A", "text": "Video Q&A\nVLMs like Qwen3.6-35B-A3B analyze selected video frames through frame sampling to:\nSummarize actions or events, such as the steps in a recorded demo\nAnswer questions about sequences, including what happened before or after an event\nLocate specific moments using timestamps, e.g., \u201cWhen does the person place the food on the grill?\u201d\nCombine visual understanding with speech transcription to capture both what is shown and what is said"}, {"id": "w6-s12", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 12", "section": null, "title": "Creating Images, Audio, and Video", "text": "Creating Images, Audio, and Video"}, {"id": "w6-s13", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 13", "section": null, "title": "Generating and Editing Images", "text": "Generating and Editing Images\nDiffusion Transformers (DiTs) and related methods turn noise into images, guided by prompts that specify the subject, setting, lighting, and composition\nModels like FLUX.2-klein-4B support text-to-image generation from descriptions and image-to-image editing through instructions\nReference images guide a person\u2019s appearance, product details, or visual style\nSome models offer inpainting to modify masked areas, outpainting to extend an image, and negative prompts to describe what to avoid"}, {"id": "w6-s14", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 14", "section": null, "title": "Generating Speech", "text": "Generating Speech\nText-to-speech (TTS) converts written text into spoken audio\nOpen-weight models like Chatterbox Multilingual V3 and closed services like ElevenLabs offer multilingual TTS, built-in voices, and voice cloning from reference recordings\nVoice conversion changes a reference recording\u2019s voice while preserving words and delivery\nVoice design creates voices from descriptions without reference recordings (e.g., OmniVoice)\nSome models support emotion and pace controls, or paralinguistic tags such as [laugh] in Chatterbox Turbo\nChatterbox uses PerTh to add an inaudible watermark that helps identify generated audio\nReference Recording\nGenerated Result"}, {"id": "w6-s15", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 15", "section": null, "title": "Generating Music", "text": "Generating Music\nText-to-music models like ACE-Step 1.5 XL Turbo use DiTs to generate instrumentals or songs with multilingual vocals\nPrompts and settings guide genre, mood, instruments, duration, and tempo, measured in beats per minute (BPM)\nLyrics specify the sung words, and tags such as [Verse] and [Chorus] guide song structure\nReference audio guides style, covers/remixes transform existing tracks, and repainting regenerates selected sections\nPop-Rock Sample\nFolk Metal Sample"}, {"id": "w6-s16", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 16", "section": null, "title": "Generating Video", "text": "Generating Video\nModels like MiniMax H3 use DiTs to generate video with synchronized sound\nText-to-video prompts describe scenes, actions, and camera movement\nImage-to-video uses a first frame, last frame, or both to guide generation\nReference-to-video uses images, video, or audio to guide, edit, or extend clips\nTemporal consistency, or keeping appearance and motion coherent across frames, is an ongoing challenge\nRef. Video\nGenerated Video\nRef. Image\nRef. Audio"}, {"id": "w6-s17", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 17", "section": null, "title": "Model Choices, Licensing, and Rights", "text": "Model Choices, Licensing, and Rights"}, {"id": "w6-s18", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 18", "section": null, "title": "Open-Weight / Closed Models (Sep 2026)", "text": "Open-Weight / Closed Models (Sep 2026)\nOpen-weight models: deployment control, subject to licensing and hosting costs\nClosed models: managed access, with provider-set pricing and limits\nBoth allow for API access: compare quality, speed, cost, and privacy"}, {"id": "w6-s19", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 19", "section": null, "title": "Weights and Serving", "text": "Weights and Serving\nCheck permissions for commercial use, self-hosting, and redistribution\nProvider-hosted APIs have their own terms\nLook for permissive licenses such as Apache 2.0, MIT, and OpenMDW 1.1, which allow commercial use subject to their terms\nCode and weights may have different licenses: OmniVoice has Apache 2.0 code but noncommercial weights (CC-BY-NC)\nGeographic restrictions may apply: MiniMax H3\u2019s community license excludes the US, but users can apply for a separate license\nWith all this in mind: What are you allowed to do with the content a model generates?"}, {"id": "w6-s2", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 2", "section": null, "title": "Going Beyond Text", "text": "Going Beyond Text\nUnderstanding Images, Audio, and Video\nCreating Images, Audio, and Video\nModel Choices, Licensing, and Rights\n2\nTopics"}, {"id": "w6-s20", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 20", "section": null, "title": "Outputs and Rights", "text": "Outputs and Rights\nCheck your rights to use or share what a model generates, including commercial-use permissions and attribution requirements\nFor example, ElevenLabs requires noncommercial use and attribution for free-plan outputs, but content generated on paid plans can be used commercially, subject to product terms\nConfirm rights to reference images, music, and recordings, including permission to clone voices\nPermission to use or sell an output does not guarantee copyright protection: US copyright protects human-authored contributions, and prompts alone are insufficient"}, {"id": "w6-s3", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 3", "section": null, "title": "Going Beyond Text", "text": "Going Beyond Text"}, {"id": "w6-s4", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 4", "section": null, "title": "Multimodal GenAI Use Cases", "text": "Multimodal GenAI Use Cases\nWork with text, images, audio, and video to:\nUnderstand existing content, including reading documents, transcribing speech, and interpreting images\nFind relevant information across documents, images, and recordings\nGenerate new content: images, spoken narration, music, and video\nCombine these capabilities into business apps using APIs backed by open- and closed-weight models"}, {"id": "w6-s5", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 5", "section": null, "title": "Examples", "text": "Examples\nCompany: UNIHAKKA INTERNATIONAL SDN BHD\nDate: 01 Jun 2018\nTotal: RM8.75\nProcess Images\nTranscribe Speech\nCreate and Edit Images\nGenerate Music"}, {"id": "w6-s6", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 6", "section": null, "title": "What Goes In vs. What Comes Out", "text": "What Goes In vs. What Comes Out\nA modality is a type of content, e.g., text, image, audio, and/or video\nA multimodal model works with multiple modalities across inputs, outputs, or both\nA vision-language model (VLM) works with both visual content and language (e.g., describe this picture)\nA multimodal large language model (MLLM) is a broader term for an LLM that works beyond text (i.e., many modern VLMs are also MLLMs)\nDifferent models support different input \u2192 output combinations\nVisual understanding: receipt image + \u201cThe total?\u201d \u2192 text answer\nTranscription: speech recording \u2192 text transcript\nImage generation: text description \u2192 generated image"}, {"id": "w6-s7", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 7", "section": null, "title": "Multimodal != Generative", "text": "Multimodal != Generative\nGenerative models produce content, including transcriptions, answers, or novel media\nA model can be multimodal without being generative\nConsider models we used for RAG:\nMultimodal embedding and reranking models find relevant material via scoring and matching \u2013 but they do not generate content\nVLMs (e.g., Qwen3.6-35B-A3B) generate answers based on retrieved visual information\nDocument VLMs such as dots.mocr generate text and layout information from page images, including optical character recognition (OCR) to recognize text in images"}, {"id": "w6-s8", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 8", "section": null, "title": "Understanding Images, Audio, and Video", "text": "Understanding Images, Audio, and Video"}, {"id": "w6-s9", "doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "loc": "Week 6, slide 9", "section": null, "title": "Image Q&A", "text": "Image Q&A\nMany VLMs, including Qwen3.6-35B-A3B, process image patches using a Vision Transformer (ViT), and these models can:\nInterpret and compare images and charts\nHelp debug UI issues from screenshots during agentic coding sessions\nIdentify objects and their attributes\nLocate items using bounding boxes, which are rectangles that mark the position of elements within an image"}, {"id": "hermes-agent-installation-guide-2026-v1-p1", "doc_id": "hermes-agent-installation-guide-2026-v1", "doc": "Hermes Agent Installation Guide 2026 v1", "loc": "Hermes Agent Installation Guide 2026 v1, page 1", "section": null, "title": "Page 1", "text": "Download, Install, and Test Hermes Agent\nThese instructions explain how to install Hermes Agent \u2013 and check\nthat the installation succeeded \u2013 on your personal computer for both\nmacOS and Windows. All the software you will need are both free and\nopen source. Please be sure to pay extra attention to any\ninstructions/notes highlighted in yellow.\nTable of Contents\n1. macOS Installation Instructions (pg. 1)\n2. Windows Installation Instructions (pg. 8)\nmacOS Installation Instructions\nDownload and open the latest version of Hermes Desktop here:\nhttps://hermes-assets.nousresearch.com/Hermes-Setup.dmg\nWhen you open the DMG file you downloaded, you will see the following\nin Finder:\nDrag the Hermes app to the Applications folder. Next, open Finder and\nbrowse to your Applications folder to find Hermes again:"}, {"id": "hermes-agent-installation-guide-2026-v1-p2", "doc_id": "hermes-agent-installation-guide-2026-v1", "doc": "Hermes Agent Installation Guide 2026 v1", "loc": "Hermes Agent Installation Guide 2026 v1, page 2", "section": null, "title": "Page 2", "text": "Double click the Hermes application icon to start it. You may then be\nasked: \u201cAre you sure you want to open it?\u201d If so, click Open.\nYou should now be at the Hermes installation screen:\nClick Install Hermes -> to begin the installation process. On the\ninstallation screen, wait for Hermes to complete all the installation\nsteps (this may take several minutes). Be aware that there is a known\nissue with the installer at time of writing (2026/08/19) where the\nstep \u201cInstall browser-tool dependencies\u201d will take just over 10\nminutes to complete (you will likely see a download completed in the\n\u201cShow details\u201d logs when this occurs) \u2013 the temporary fix is to\npatiently wait it out."}, {"id": "hermes-agent-installation-guide-2026-v1-p3", "doc_id": "hermes-agent-installation-guide-2026-v1", "doc": "Hermes Agent Installation Guide 2026 v1", "loc": "Hermes Agent Installation Guide 2026 v1, page 3", "section": null, "title": "Page 3", "text": "When the installation finishes, you will see the following screen:\nClick Launch Hermes to proceed. You will need to wait briefly for\nHermes to load:"}, {"id": "hermes-agent-installation-guide-2026-v1-p4", "doc_id": "hermes-agent-installation-guide-2026-v1", "doc": "Hermes Agent Installation Guide 2026 v1", "loc": "Hermes Agent Installation Guide 2026 v1, page 4", "section": null, "title": "Page 4", "text": "In the meantime, you may be asked if you want to \u201cAllow \u2018Hermes\u2019 to\nfind devices on your local networks?\u201d \u2013 click Allow:\nBack on Hermes, you will be asked to \u201cConnect a model...\u201d:\nClick the small \u201cI have an API key\u201d button in the lower right to\narrive at this screen:"}, {"id": "hermes-agent-installation-guide-2026-v1-p5", "doc_id": "hermes-agent-installation-guide-2026-v1", "doc": "Hermes Agent Installation Guide 2026 v1", "loc": "Hermes Agent Installation Guide 2026 v1, page 5", "section": null, "title": "Page 5", "text": "As shown in the screenshot above, select \u201cLocal / custom endpoint\u201d and\nenter the following details in the two boxes at the bottom:\nhttp://dobolyi.com:9000/v1\n6418\nOnce done, click Connect to arrive at this screen:\nYour installation is now complete. Test it by typing \u201chi\u201d in the input\nbox at the bottom (after a few moments, you should see a response\nsimilar to what\u2019s shown below):"}, {"id": "hermes-agent-installation-guide-2026-v1-p6", "doc_id": "hermes-agent-installation-guide-2026-v1", "doc": "Hermes Agent Installation Guide 2026 v1", "loc": "Hermes Agent Installation Guide 2026 v1, page 6", "section": null, "title": "Page 6", "text": "You can now also load Hermes up in the Terminal (found in Applications\n-> Utilities -> Terminal) by simply typing hermes at the prompt and\npressing Return:\nDoing so will pull up the CLI version of Hermes:"}, {"id": "hermes-agent-installation-guide-2026-v1-p7", "doc_id": "hermes-agent-installation-guide-2026-v1", "doc": "Hermes Agent Installation Guide 2026 v1", "loc": "Hermes Agent Installation Guide 2026 v1, page 7", "section": null, "title": "Page 7", "text": "(scanned \u2014 no text layer)"}, {"id": "hermes-agent-installation-guide-2026-v1-p8", "doc_id": "hermes-agent-installation-guide-2026-v1", "doc": "Hermes Agent Installation Guide 2026 v1", "loc": "Hermes Agent Installation Guide 2026 v1, page 8", "section": null, "title": "Page 8", "text": "Windows Installation Instructions\nDownload and open the latest version of Hermes Desktop here:\nhttps://hermes-assets.nousresearch.com/Hermes-Setup.exe\nOpen the executable you downloaded to begin the installation process:\nClick INSTALL to begin the installation process. On the installation\nscreen, wait for Hermes to complete all the installation steps (this\nmay take several minutes). You may be prompted by User Account Control\n(UAC) to answer a question such as: \u201cDo you want to allow this app\nfrom an unknown publisher to make changes to your device?\u201d \u2013 if so,\nanswer Yes (e.g., for cua-driver.exe, which allows Hermes to control\napplications on your computer on your behalf). Be aware that there is\na known issue with the installer at time of writing (2026/08/19) where\nthe some steps may take 10 minutes to complete \u2013 the temporary fix is\nto patiently wait it out."}, {"id": "hermes-agent-installation-guide-2026-v1-p9", "doc_id": "hermes-agent-installation-guide-2026-v1", "doc": "Hermes Agent Installation Guide 2026 v1", "loc": "Hermes Agent Installation Guide 2026 v1, page 9", "section": null, "title": "Page 9", "text": "When the installation finishes, you will see the following screen:\nClick LAUNCH to proceed. You will need to wait briefly for Hermes to\nload:\nEventually, you will be asked to \u201cConnect a model...\u201d:"}, {"id": "hermes-agent-installation-guide-2026-v1-p10", "doc_id": "hermes-agent-installation-guide-2026-v1", "doc": "Hermes Agent Installation Guide 2026 v1", "loc": "Hermes Agent Installation Guide 2026 v1, page 10", "section": null, "title": "Page 10", "text": "Click the small \u201cI have an API key\u201d button in the lower right to\narrive at this screen:\nAs shown in the screenshot above, select \u201cLocal / custom endpoint\u201d and\nenter the following details in the two boxes at the bottom:\nhttp://dobolyi.com:9000/v1\n6418\nOnce done, click Connect to arrive at this screen:"}, {"id": "hermes-agent-installation-guide-2026-v1-p11", "doc_id": "hermes-agent-installation-guide-2026-v1", "doc": "Hermes Agent Installation Guide 2026 v1", "loc": "Hermes Agent Installation Guide 2026 v1, page 11", "section": null, "title": "Page 11", "text": "Your installation is now complete. Test it by typing \u201chi\u201d in the input\nbox at the bottom (after a few moments, you should see a response\nsimilar to what\u2019s shown below):\nYou can now also load Hermes up in the Terminal (Windows Menu ->\nSearch -> Terminal) by simply typing hermes at the prompt and pressing\nEnter:"}, {"id": "hermes-agent-installation-guide-2026-v1-p12", "doc_id": "hermes-agent-installation-guide-2026-v1", "doc": "Hermes Agent Installation Guide 2026 v1", "loc": "Hermes Agent Installation Guide 2026 v1, page 12", "section": null, "title": "Page 12", "text": "Doing so will pull up the CLI version of Hermes:"}, {"id": "mbax-6418-assignment-1-p1", "doc_id": "mbax-6418-assignment-1", "doc": "MBAX 6418 Assignment 1", "loc": "MBAX 6418 Assignment 1, page 1", "section": null, "title": "Page 1", "text": "MBAX 6418 \u2014 Assignment 1: Sentiment & Emotion\nClassification of Amazon Reviews\nGoal: Produce a working review-sentiment classifier for Amazon reviews \u2014 it classifies each\nreview as positive / neutral / negative, detects the primary emotion, checks its predictions\nagainst the star rating, and presents everything in a polished dashboard.\nHow to work on this: drive it with an agent \u2014 each step is a goal to reach, not a checklist. You\nand the agent choose the approach as you go: API, tooling, structure, dashboard design. A few\nfixed choices: the classification and scoring code is written in Python, and model calls go\nthrough an OpenAI-compatible endpoint (e.g., the endpoints provided to the class). The\ndashboard itself can be HTML or anything else. Work in order \u2014 each step should leave you\nwith something working. Your classmates are fair game for comparing approaches, asking\nquestions, and teaming up \u2014 but the write-up is owned by whoever submits it, and everyone\nsubmits their own copy (see the GitHub section for how that works).\nA note: where an earlier step hints at a later \"known finding,\" treat it as a hunch to test \u2014 it's\nmore interesting if your numbers disagree.\n(Useful if you haven't seen them: OpenAI offers verified US/Canada students $100 in ChatGPT\ncredits for use in Codex \u2014 https://developers.openai.com/community/students.)\nThe data\nThe task uses the Amazon 2023 \"Gift Cards\" review category \u2014 part of the large-scale\nAmazon Reviews '23 dataset collected by the McAuley Lab at UC San Diego. You can learn\nmore about the dataset (its scale, other categories, and the full field reference) on the dataset's\nsite:\nhttps://amazon-reviews-2023.github.io\nThe Gift Cards review file itself lives on the McAuley Lab's public dataset host:\nhttps://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/review_cate\ngories/Gift_Cards.jsonl.gz\nIt is a gzipped JSON Lines (newline-delimited JSON) file; each line is one review. Expected\nfields:"}, {"id": "mbax-6418-assignment-1-p2", "doc_id": "mbax-6418-assignment-1", "doc": "MBAX 6418 Assignment 1", "loc": "MBAX 6418 Assignment 1, page 2", "section": null, "title": "Page 2", "text": "rating \u2014 the star rating, a number in {1, 2, 3, 4, 5} (encoded as a float, e.g., 4.0 ;\nintegral values throughout this dataset).\ntitle \u2014 the short review-issue title.\ntext \u2014 the review body.\nverified_purchase \u2014 boolean, whether the reviewer actually bought the item.\nhelpful_vote \u2014 integer count of \"helpful\" votes for the review.\ntimestamp \u2014 Unix milliseconds when the review was written.\nimages \u2014 array; image references attached to the review (often empty).\nasin \u2014 the product this review is about.\nparent_asin \u2014 the product family / parent item.\nuser_id \u2014 the reviewer.\nUse your judgment about metadata worth keeping. Before building anything, confirm you can\nactually read the file.\nStep 1 \u2014 A structured prompt\nA reusable prompt that takes a review's title and text and asks an LLM (see recommended\nendpoint below) to classify it as POSITIVE or NEGATIVE. Decide the edge cases yourself\n(conflicting title/text, terse or angry short reviews); the prompt must be set up so the model\ngives you a clear, simple answer you can read back programmatically, and it must not rely on\nthe rating.\nAsk yourself: does a quick spot-check on obviously positive and negative reviews come out\nright?\nRecommended LLM endpoint:\nBase URL: http://dobolyi.com:9001/v1\nAPI Key: 6418\nModel Name: cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit\nStep 2 \u2014 Score against the rating\nScore a 100-row first batch and see how the model does against the \"correct answer\" you work\nout from the rating (\u22654 positive, else negative). The model must never see the rating \u2014 it's\nonly for checking afterwards. How you structure and save the work is up to you; at minimum, be\nable to say how often the model agrees with the rating, which reviews it gets wrong, and a feel\nfor how often it's right on each class."}, {"id": "mbax-6418-assignment-1-p3", "doc_id": "mbax-6418-assignment-1", "doc": "MBAX 6418 Assignment 1", "loc": "MBAX 6418 Assignment 1, page 3", "section": null, "title": "Page 3", "text": "Ask yourself: can you say, with evidence, what the model is good and bad at? Keep in mind\nthe data is heavily skewed toward high ratings \u2014 most reviews are \u2605\u2605\u2605\u2605 or \u2605\u2605\u2605\u2605\u2605 \u2014\nand don't let that lopsidedness fool you into thinking the model is better than it is.\nStep 3 \u2014 A results dashboard\nPresent the results in a visual dashboard. A single self-contained HTML page is a good\noption \u2014 everything baked into one file, works offline, no server or network needed \u2014 but\nyou're not limited to it: interactive app frameworks like Streamlit and Gradio work just as well.\nDecide what belongs in it; at minimum the headline numbers, a clear picture of which answers\nwere right and wrong and how mistakes cluster by class, and enough per-review detail to back\nup what you claim.\nDesign bar: this is a product, not a demo. Deliberate palette, refined typography, a coherent\ntheme the host can recolor \u2014 no library-shuffle look.\nAsk yourself: do the numbers on the page match what your scoring produced, and can a non-\ntechnical reader tell at a glance how good the model is?\nStep 4 \u2014 Interactive review filtering\nMake the review table explorable: let a reader filter to a subset (e.g., correct vs mismatched)\nwith a live count. Whether you do more than that is up to you.\nAsk yourself: does filtering show exactly the rows you asked for, and does the count make\nsense with what you recorded?\nStep 5 \u2014 Primary-emotion detection\nAdd two independent takes on the review's primary emotion:\n1. The LLM predicts it \u2014 extend the prompt's output so each review gives both sentiment\nand a primary emotion.\n2. A word list derives it \u2014 score each review's words against an NRC emotion word list (a\npublic list linking words to emotions: anger, anticipation, disgust, fear, joy, sadness, surprise,\ntrust), add the scores per emotion, and take the highest as the answer. This needs no\nmodel calls and runs over your existing predictions."}, {"id": "mbax-6418-assignment-1-p4", "doc_id": "mbax-6418-assignment-1", "doc": "MBAX 6418 Assignment 1", "loc": "MBAX 6418 Assignment 1, page 4", "section": null, "title": "Page 4", "text": "Keep both, and compare them.\nAsk yourself: how often do the two agree, and where/why do they diverge?\nStep 6 \u2014 Three-class scoring with balanced sampling\nRedefine to the full split:\nRating Class\n4\u20135 POSITIVE\n3 NEUTRAL\n1\u20132 NEGATIVE\nCarry the change through everything \u2014 the correct answer you work out, the numbers you\ntrack, the prompt, and how the dashboard shows it. Because reading the first N rows in order\nunder-represents the rarer classes, instead pull a balanced group from the whole file \u2014 a\nroughly equal number from each class, picked with a fixed random seed so the same set\ncomes up every time \u2014 around 50 per class.\nAsk yourself: what do the balanced three-class numbers actually show, and what did the\nbalanced run reveal that the imbalanced one hid? In particular, do \u2605\u2605\u2605 (3-star) reviews get\ntheir own class, or do they collapse into another?\nStep 7 \u2014 Descriptive and prediction visualizations\nGive the dashboard a descriptive layer \u2014 e.g., a star-rating distribution, a comparison of the\n\"correct answer\" versus what the model predicted for each class, and how often each class was\nanswered right. The point is to make the model's failures visible at a glance.\nTwo things to be careful about:\nCheck the numbers on the page against the numbers you saved earlier \u2014 in the browser,\nnot just by eye.\nWatch out for layout bugs that can collapse very small chart elements (e.g., bars given zero\nwidth by a label/positioning interaction).\nAsk yourself: can a reader see, without drilling in, where the model succeeds and fails?"}, {"id": "mbax-6418-assignment-1-p5", "doc_id": "mbax-6418-assignment-1", "doc": "MBAX 6418 Assignment 1", "loc": "MBAX 6418 Assignment 1, page 5", "section": null, "title": "Page 5", "text": "Final deliverables\nProduce a short report plus the working files: the prompt, the scoring script that runs the\nreviews, the word-list script that adds the emotions, the dashboard generator, one balanced\nrun's raw output, and the final dashboard.\nReport format: write it as markdown in a README.md (so it can later drop into a GitHub\nrepository as-is), and include one or more screenshots of at least the interface (for example,\na capture of the dashboard you built). Make sure every number you quote in it matches a visible\nfigure in the saved output. Also cite the source of the data (the Amazon Reviews '23 dataset\nand its page) inside the README \u2014 don't expect a reader to go hunting for where the reviews\ncame from.\nThe report should be able to answer, with evidence:\n1. Why did the lopsided run look very accurate, and what did sampling equal amounts of each\nclass change?\n2. Look at where the model's mistakes go \u2014 which classes get confused with which, and in\nwhat direction? (For example, do \u2605\u2605\u2605 (i.e., 3-star neutral) reviews get labeled negative,\nor do negative ones get called neutral?) Report the concrete numbers from your matrix.\n3. How do the LLM's emotions and the word list's emotions differ, and why?\n4. What bugs and/or issues did you hit along the way \u2014 in the charts, the UI, in the process of\nworking with the agent, or anywhere else \u2014 and how did you work around them?\nAuthor / review split: the report should be generated with the agent (it produces the draft,\npulls the numbers from the saved output, writes the narrative), but it is your deliverable \u2014\nreview and check it yourself before submitting. Checking the claimed numbers against the\nsaved output and putting the agent's framing and conclusions into your own words is part of the\nassignment, not an optional pass.\nSubmission: publish to GitHub and share the link\nRequirement: the final README.md report and all the project code must live in a GitHub\nrepository, and you must hand in a shareable link to it. There is no alternative submission\npath \u2014 the repo is the submission.\nOne per person, even in a team. If you work with classmates on the same work, you don't all\nshare one repo and one hand-in \u2014 each of you submits your own repository, even if it\ncontains essentially the same project. That requirement is there on purpose: it verifies that"}, {"id": "mbax-6418-assignment-1-p6", "doc_id": "mbax-6418-assignment-1", "doc": "MBAX 6418 Assignment 1", "loc": "MBAX 6418 Assignment 1, page 6", "section": null, "title": "Page 6", "text": "GitHub access works for every person in the class, not just one or two per group. If a teammate\npushes and everyone else just forwards the same link, only that teammate's account has\nproven GitHub works.\nPublic or private? Public is the simplest default \u2014 anyone with the link can read it, no extra\nsteps. Private works too, but it costs you one small step: add me\n( david.dobolyi@colorado.edu ) as a collaborator on the repo, otherwise I can't see the files\nwhen I open it. Do that after you create the repo, before you hand in the link.\nWhere to submit the link. The repo link is handed in as the assignment submission on\nCanvas \u2014 put the shareable GitHub link in the Canvas submission so it's tied to your account\nthere. Just make sure the link you paste works (see the check further down) before you hit\nsubmit.\nNew to GitHub? That's expected and fine \u2014 you'll likely need to create an account. Sign up\nhere if you don't have one:\nhttps://github.com/signup\nBecause you're all students, the GitHub Student Developer Pack gives you free access to\ntools that normally cost money \u2014 including GitHub Pro, Copilot, and Codespaces credits \u2014\nplus bundled tutorials for getting started with git and open source:\nhttps://education.github.com/pack\nThe agent can and should help with every step. It can't sign up for you (only you can), but it\ncan:\nguide you through account creation and the one-time setup (creating a token /\nauthenticating git ),\ninitialize a repository in your project folder,\nstage and commit your code and the report,\ncreate the GitHub repository and push to it,\nfor a private repo, invite me ( david.dobolyi@colorado.edu ) as a collaborator,\ntell you how to confirm it's accessible and grab the shareable link.\nBefore you push, be deliberate about what goes in: include the code and the README.md ; think\nabout whether the data file (which is large and re-downloadable) or any credentials/tokens\nbelong in the repo \u2014 generally they don't. Ask the agent if you're unsure what's safe to commit.\nAsk yourself: does the link you submit open a repository that you can access, and would the\nperson grading it be able to too \u2014 a public repo readably, or a private one after you've invited"}, {"id": "mbax-6418-assignment-1-p7", "doc_id": "mbax-6418-assignment-1", "doc": "MBAX 6418 Assignment 1", "loc": "MBAX 6418 Assignment 1, page 7", "section": null, "title": "Page 7", "text": "them? Can they see the README (screenshots and all), and is the code there enough to\nreproduce your results?\nStanding considerations\nThe rating is the correct answer: it's what you judge the model against, but the model\nnever sees it.\nMake your results repeatable: any number you publish should come from a fixed choice\nof which reviews were used (a fixed \"seed\") and fixed settings, so running it again gives the\nsame answer.\nShow your work: every number you claim should match the saved output \u2014 don't publish\nsomething you haven't re-checked.\nBe honest about imbalance: say openly how unbalanced the data is; never let a run that's\nmostly one easy class look like proof the model is great.\nProduct bar: the dashboard is a finished, cohesive product."}];

const state = {answers:{}, checked:{}, skipped:{}};
const LS_KEY = "mbax6418-quiz-v1";
const KEY_LS = "mbax6418-chat-key";
const GEN_LS = "mbax6418-quizgen-v1";
const BANK_ID = "__bank__";
const STOP = new Set(("the a an and or of to in on for with is are was be by at it its "+
  "this that these those from as into how what why does do can you your we our i me us").split(" "));

let activeSet = BANK_ID;
let generated = {};

function load(){try{const s=localStorage.getItem(LS_KEY);if(s)Object.assign(state,JSON.parse(s));}catch(e){}}
function persist(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function loadGen(){try{generated=JSON.parse(localStorage.getItem(GEN_LS)||"{}");}catch(e){generated={};}}
function persistGen(){try{localStorage.setItem(GEN_LS,JSON.stringify(generated));}catch(e){}}
function toks(t){return (t.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(w=>!STOP.has(w));}
function qid(setId,docId,q){return setId+"|"+docId+"|"+q.question.slice(0,40);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seededShuffle(arr,rng){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function sets(){
  const list=[{id:BANK_ID,name:"Course bank"}];
  Object.keys(generated).forEach(id=>list.push({id,name:generated[id].meta.name}));
  return list;
}
function setDocs(setId){
  if(setId===BANK_ID)return QUIZ.docs;
  const d=generated[setId]&&generated[setId].docs;
  return d||{};
}
function allQuestions(setId){
  const out=[];const docs=setDocs(setId);
  for(const docId in docs)
    for(const q of docs[docId].questions)out.push({docId,q});
  return out;
}

/* ---------- rendering ---------- */
function renderTabs(){
  const tabs=document.getElementById("tabs");tabs.innerHTML="";
  sets().forEach(s=>{
    const b=document.createElement("button");
    b.className="tab"+(activeSet===s.id?" on":"");
    b.textContent=s.name;
    b.onclick=()=>{activeSet=s.id;renderTabs();renderCards();};
    tabs.appendChild(b);
  });
  const n=document.createElement("button");
  n.className="tab newtab";n.textContent="+ New quiz";
