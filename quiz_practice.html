<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBAX 6418 · Practice Quizzes</title>
<style>
/* ---------- token theme (recolor by editing :root) ---------- */
:root{
  --bg:#FAF7F0;            /* CU-buff-tinted paper */
  --fg:#1B1B1B;            /* CU black */
  --muted:#6B675E;
  --card:#FFFFFF;
  --line:#E4DECF;
  --accent:#B8994A;        /* CU gold */
  --accent-deep:#8A6D2F;
  --accent-ink:#33280C;
  --good:#2E6B3E;
  --good-bg:#E9F2EA;
  --bad:#A33B2E;
  --bad-bg:#FAEAE7;
  --radius:14px;
  --font:"Inter","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
  line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:40px 22px 80px}
.overline{font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent-deep);font-weight:700}
h1{font-size:30px;margin:6px 0 8px;letter-spacing:-.02em}
.sub{color:var(--muted);max-width:76ch;margin:0 0 26px;font-size:14.5px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 18px;min-width:120px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pbar{flex:1 1 100%;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;width:0%;background:var(--accent);transition:width .25s}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.tab{padding:8px 16px;border:1px solid var(--line);background:var(--card);
  border-radius:99px;font:600 13px var(--font);color:var(--muted);cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab.newtab{border-style:dashed;color:var(--accent-deep)}
.tab.newtab:hover{border-color:var(--accent-deep)}
.docpill{font:700 12px var(--font);color:var(--accent-deep);margin:14px 0 6px;
  text-transform:uppercase;letter-spacing:.07em}
/* question cards */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;margin:0 0 16px}
.qhead{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.qnum{font:800 13px var(--font);color:var(--accent-deep)}
.tag{font:600 11px var(--font);padding:3px 10px;border-radius:99px;background:#F1EBDC;
  color:var(--accent-deep);text-transform:uppercase;letter-spacing:.06em}
.tag.saved{display:none}
.loc{margin-left:auto;font:600 11.5px var(--font);color:var(--muted);text-align:right}
.stem{font-size:16.5px;font-weight:600;margin:0 0 14px;letter-spacing:-.01em}
.opts{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.opts label{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;
  border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14.5px;
  transition:border-color .12s, background .12s}
.opts label:hover{border-color:var(--accent)}
.opts .ltr{font-weight:800;color:var(--muted);min-width:18px}
.opts input{accent-color:var(--accent-deep);margin-top:3px}
.q.chk .opts label{pointer-events:none}
.q.chk .opts label.right{border-color:var(--good);background:var(--good-bg)}
.q.chk .opts label.right .ltr{color:var(--good)}
.q.chk .opts label.wrong{border-color:var(--bad);background:var(--bad-bg)}
.q.chk .opts label.wrong .ltr{color:var(--bad)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:700 13.5px var(--font);border:none;border-radius:10px;padding:9px 18px;
  cursor:pointer;background:var(--fg);color:#FFF}
.btn:disabled{opacity:.4;cursor:default}
.btn.plain{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.ghost{background:#F1EBDC;color:var(--accent-deep);border:1px solid transparent}
.reveal{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
.q.chk .reveal{display:block}
.verdict{font:700 13px var(--font);margin:0 0 8px}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
.rationale{font-size:14px;margin:0 0 4px}
details.source{font-size:13.5px;border:1px solid var(--line);border-radius:10px;
  background:#FBF9F3;padding:10px 14px;margin-top:10px}
details.source summary{cursor:pointer;font-weight:700;color:var(--accent-deep)}
.snippet{margin:10px 0 0;white-space:pre-wrap;color:var(--muted);font-size:13px;
  border-top:1px dashed var(--line);padding-top:10px}
/* visual evidence */
.evidence{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.evidence figure{margin:0;padding:6px;border:1px solid var(--line);border-radius:10px;
  background:#FFF}
.evidence img{display:block;max-width:300px;max-height:220px;border-radius:7px;
  cursor:zoom-in;object-fit:contain}
.evidence figcaption{font:600 10.5px var(--font);color:var(--muted);margin-top:5px;
  text-align:center;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{margin-top:34px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);
  padding-top:16px}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(20,18,12,.85);display:none;align-items:center;
  justify-content:center;z-index:60;cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-width:94vw;max-height:92vh;border-radius:8px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.lb p{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#EDE7D6;
  font:600 12px var(--font)}
/* modals */
.overlay{position:fixed;inset:0;background:rgba(27,27,27,.45);display:none;
  align-items:center;justify-content:center;z-index:50}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:16px;padding:24px 26px;width:min(540px,92vw);
  max-height:88vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.modal h2{margin:0 0 6px;font-size:18px}
.modal p{color:var(--muted);font-size:13px;margin:0 0 14px}
.modal label.chk{display:flex;gap:8px;align-items:center;font:600 13.5px var(--font);
  padding:7px 0;color:var(--fg)}
.modal input[type=text],.modal input[type=password]{width:100%;padding:11px 13px;
  border:1px solid var(--line);border-radius:10px;font:13.5px var(--font);margin-bottom:12px}
.modal input[type=checkbox]{accent-color:var(--accent-deep)}
.modal .row{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.modal .row .grow{flex:1;display:flex;gap:10px;align-items:center}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:var(--accent);width:0%;transition:width .2s}
.genlog{font:600 12px var(--font);color:var(--muted);white-space:pre-wrap;max-height:120px;
  overflow:auto}
.lbl{font-weight:700;margin:12px 0 2px;color:var(--fg);font-size:13.5px}
.hidden{display:none}
@media(max-width:600px){.wrap{padding:24px 14px 60px}h1{font-size:24px}
  .evidence img{max-width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="overline">MBAX 6418 · Study tool</div>
  <h1>Practice Quizzes</h1>
  <p class="sub" id="sub"></p>

  <div class="stats">
    <div class="stat"><b id="sDone">0/0</b><span>answered</span></div>
    <div class="stat"><b id="sRight">0</b><span>correct</span></div>
    <div class="stat"><b id="sSkipped">0</b><span>skipped</span></div>
    <div class="stat"><b id="sPct">—</b><span>accuracy</span></div>
    <div class="pbar"><i id="sBar"></i></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="deck"></div>
  <div class="actions" style="margin-top:6px">
    <button class="btn plain" id="reset">Reset progress</button>
  </div>

  <p class="foot" id="foot"></p>
</div>

<!-- lightbox -->
<div class="lb" id="lb"><img id="lbImg" alt="source image"><p id="lbCap"></p></div>

<!-- generation / key modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="genModal">
    <h2 id="genTitle">Generate a quiz</h2>
    <p id="genSub"></p>
    <div id="genForm">
      <p class="lbl">Choose course material</p>
      <div id="docPick"></div>
      <p class="lbl">Topic filter (optional)</p>
      <input type="text" id="topicIn" placeholder="e.g. quantization, RAG, embeddings — leave empty for all">
      <p class="lbl">Questions per document</p>
      <div class="row"><div class="grow">
        <input type="range" id="countIn" min="3" max="8" value="6" style="flex:1">
        <span id="countLbl" style="font:700 13px var(--font)">6</span>
      </div></div>
    </div>
    <div id="genRun" class="hidden">
      <div class="progress"><i id="genBar"></i></div>
      <div class="genlog" id="genLog"></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn ghost" id="genCancel">Cancel</button>
      <button class="btn" id="genGo">Generate</button>
    </div>
  </div>
</div>

ments (e.g., buttons, sliders, and text inputs) to help you quickly build interactive Python apps.'", "source_chunk_id": "w4-s6"}, {"question": "According to the slide, what is the primary reason for creating a thorough bug report when fixing software errors?", "options": ["It allows the agent to automatically verify that the code compiles without errors.", "It prevents the code from containing any bugs during the initial build phase.", "It helps document, reproduce, and ultimately fix each issue.", "It ensures that the agent will never claim a bug is fixed when it is not."], "answer": 2, "rationale": "The slide states that a thorough bug report 'helps document, reproduce, and ultimately fix each issue.'", "source_chunk_id": "w4-s18"}, {"question": "According to the slide, what is the specific starter prompt provided for creating the small web app?", "options": ["build a python app using streamlit for a pizza ordering website where customers can customize their pizzas with things like toppings, size, crust, etc.", "build a python app using django for a pizza ordering website where customers can customize their pizzas with things like toppings, size, crust, etc.", "build a python app using flask for a pizza ordering website where customers can customize their pizzas with things like toppings, size, crust, etc.", "build a python app using gradio for a pizza ordering website where customers can customize their pizzas with things like toppings, size, crust, etc."], "answer": 3, "rationale": "The slide explicitly lists the starter prompt as: 'build a python app using gradio for a pizza ordering website where customers can customize their pizzas with things like toppings, size, crust, etc.'", "source_chunk_id": "w4-s4"}]}, "week05": {"name": "Week 5 - Context Engineering and RAG v1.pptx", "kind": "slide", "questions": [{"question": "According to the slide, how does semantic search typically represent text and other data to retrieve information relevant to a user's question?", "options": ["By assigning random numerical values to text to ensure that all data points are evenly distributed in a low-dimensional space.", "By relying on vector search to compare the question's embedding with data embeddings without using any numerical representation.", "By using keyword matching algorithms to find exact word overlaps between the user's question and the database.", "By converting data into embeddings that act as coordinates in high-dimensional space, where similar items are positioned closer together."], "answer": 3, "rationale": "The slide states that 'Semantic search typically uses embeddings to numerically represent text' and that 'Embeddings are like coordinates in high-dimensional space: similar items tend to lie closer together.'", "source_chunk_id": "w5-s15"}, {"question": "According to the slide, how does RAG optimize context compared to fine-tuning?", "options": ["Both RAG and fine-tuning adapt the model itself through additional training to optimize context.", "Both RAG and fine-tuning optimize context by supplying relevant information when the model responds.", "RAG optimizes context by supplying relevant information when the model responds, whereas fine-tuning adapts the model itself through additional training.", "RAG adapts the model through additional training, while fine-tuning supplies relevant information during response generation."], "answer": 2, "rationale": "The slide explicitly states that 'RAG optimizes context by supplying relevant information when the model responds' and distinguishes this from fine-tuning, which 'adapts the model itself through additional training.'", "source_chunk_id": "w5-s13"}, {"question": "In a Hybrid RAG Pipeline with Reranking, what is the specific function of the reranking step after retrieval has identified candidate chunks?", "options": ["RAG uses information from prepared documents to help an LLM answer the user\u2019s question", "Reranking compares these candidates to the original question and prioritizes which chunks are supplied to the LLM as context", "Retrieval finds relevant candidate chunks using both keyword search and vector search in Hybrid RAG", "Keyword search is used to find relevant candidate chunks using both keyword search and vector search in Hybrid RAG"], "answer": 1, "rationale": "The slide states that 'Reranking compares these candidates to the original question and prioritizes which chunks are supplied to the LLM as context.'", "source_chunk_id": "w5-s18"}, {"question": "According to the slide, what is the primary function of the indexing step in preparing documents for search?", "options": ["Preparing chunked passages for both keyword and vector search", "Extracting raw text and structure from the original document files", "Generating embeddings to find chunks with similar meanings only", "Dividing parsed content into passages while preserving source metadata"], "answer": 0, "rationale": "The slide states that 'Indexing prepares the chunked passages for both: Keyword (lexical) search... [and] Vector search'.", "source_chunk_id": "w5-s16"}, {"question": "According to the slide titled 'Context Engineering', which specific technology is listed as a key component or topic alongside building a RAG system?", "options": ["Transformer Architecture", "Retrieval Augmented Generation (RAG)", "Large Language Model (LLM) Fine-tuning", "Natural Language Processing (NLP)"], "answer": 1, "rationale": "The slide explicitly lists 'Retrieval Augmented Generation (RAG)' as a topic under the heading 'Context Engineering'.", "source_chunk_id": "w5-s2"}, {"question": "According to the slide, which chunking strategy involves splitting text based on structural boundaries such as headings to keep related information together?", "options": ["Recursive", "Fixed size", "Semantic", "Document-based"], "answer": 3, "rationale": "The slide defines Document-based chunking as a strategy that keeps related information together based on structural boundaries such as headings.", "source_chunk_id": "w5-s17"}]}, "week06": {"name": "Week 6 - Multimodal Generative AI v1.pptx", "kind": "slide", "questions": [{"question": "According to the slide, what is the primary function of speaker diarization in the context of speech-to-text processing?", "options": ["Identifying and labeling who spoke at specific times, such as distinguishing between Speaker 1 and Speaker 2", "Converting spoken audio directly into written text without any speaker identification", "Providing multilingual transcription capabilities and segment timestamps for each passage", "Enhancing audio quality to ensure accurate automatic speech recognition by NVIDIA Nemotron-3"], "answer": 0, "rationale": "The slide states that 'Speaker diarization labels who spoke when (e.g., \u201cSpeaker 1\u201d vs. \u201cSpeaker 2\u201d)', distinguishing it from ASR which converts audio to text.", "source_chunk_id": "w6-s10"}, {"question": "Based on the provided slide, which statement best distinguishes a Vision-Language Model (VLM) from the broader category of Multimodal Large Language Models (MLLM)?", "options": ["A VLM is defined strictly as a model that processes both visual content and language, whereas an MLLM is a broader term for any LLM that operates beyond text, including but not limited to VLMs.", "A VLM is a specific type of MLLM that only generates text from images, while an MLLM can only process audio inputs.", "A VLM refers to any model that works with multiple modalities across inputs or outputs, while an MLLM is restricted to visual understanding tasks like reading receipts.", "A VLM is a subset of MLLMs that exclusively handles transcription tasks, converting speech recordings into text transcripts."], "answer": 0, "rationale": "The slide defines a VLM as working with 'both visual content and language' and describes an MLLM as a 'broader term for an LLM that works beyond text,' noting that 'many modern VLMs are also MLLMs.'", "source_chunk_id": "w6-s6"}, {"question": "According to the slide, what is a potential licensing discrepancy between the code and weights of a model like OmniVoice?", "options": ["The code and weights share the same license, but geographic restrictions apply only to the code, not the weights.", "Both the code and weights are exclusively licensed under MIT, permitting unrestricted commercial use without attribution.", "The code is licensed under Apache 2.0 while the weights are licensed under CC-BY-NC, restricting commercial use.", "The code is noncommercial while the weights are licensed under Apache 2.0, allowing free commercial redistribution."], "answer": 2, "rationale": "The slide explicitly states that 'Code and weights may have different licenses: OmniVoice has Apache 2.0 code but noncommercial weights (CC-BY-NC).'", "source_chunk_id": "w6-s19"}, {"question": "According to the slide, what is the primary distinction between open-weight and closed models regarding their operational structure?", "options": ["Open-weight models offer managed access with provider-set pricing, while closed models require users to manage their own deployment and hosting costs.", "Open-weight models are subject to licensing and hosting costs with user-controlled deployment, whereas closed models provide managed access with provider-set pricing and limits.", "Both open-weight and closed models eliminate the need for API access, focusing solely on local installation without external connectivity.", "Closed models allow for full deployment control and lower hosting costs, while open-weight models restrict access through strict provider limits and managed services."], "answer": 1, "rationale": "The slide states that open-weight models involve 'deployment control, subject to licensing and hosting costs,' while closed models offer 'managed access, with provider-set pricing and limits.'", "source_chunk_id": "w6-s18"}, {"question": "According to the slide, what is identified as an ongoing challenge in video generation models?", "options": ["Maintaining temporal consistency across frames", "Ensuring synchronized sound with visual output", "Generating prompts that describe camera movement", "Using reference images to guide initial generation"], "answer": 0, "rationale": "The slide explicitly states that 'Temporal consistency, or keeping appearance and motion coherent across frames, is an ongoing challenge.'", "source_chunk_id": "w6-s16"}, {"question": "According to the slide, what is the primary function of reference images in the context of generating and editing images with models like FLUX.2-klein-4B?", "options": ["Reference images are used to guide a person\u2019s appearance, product details, or visual style.", "Reference images are used to modify masked areas within an existing image.", "Reference images are used to extend an image beyond its original boundaries.", "Reference images are used to describe what to avoid in the final output."], "answer": 0, "rationale": "The slide explicitly states that 'Reference images guide a person\u2019s appearance, product details, or visual style,' whereas negative prompts describe what to avoid, inpainting modifies masked areas, and outpainting extends images.", "source_chunk_id": "w6-s13"}]}, "hermes-agent-installation-guide-2026-v1": {"name": "Hermes Agent Installation Guide 2026 v1", "kind": "page", "questions": [{"question": "According to the installation guide, what is the required user action immediately after the installation process completes?", "options": ["Click the LAUNCH button to proceed with loading Hermes", "Restart the computer to finalize the installation", "Wait for the system to automatically launch the model connection screen", "Manually configure the model settings before the screen appears"], "answer": 0, "rationale": "The slide explicitly states that when the installation finishes, the user must 'Click LAUNCH to proceed' before waiting for Hermes to load.", "source_chunk_id": "hermes-agent-installation-guide-2026-v1-p9"}, {"question": "According to the Hermes Agent Installation Guide, what is the recommended action if the installation process appears to be stuck for up to 10 minutes?", "options": ["Patience is required as this is a known issue with a temporary fix of waiting it out.", "Contact Nous Research support for a new installer version.", "Manually edit the registry to bypass the cua-driver.exe verification.", "Cancel the installation and restart the computer immediately."], "answer": 0, "rationale": "The slide states there is a known issue where steps may take 10 minutes to complete and the temporary fix is to 'patiently wait it out.'", "source_chunk_id": "hermes-agent-installation-guide-2026-v1-p8"}, {"question": "According to the slide, which button must be clicked to proceed after being asked to 'Connect a model'?", "options": ["Click 'Skip' to bypass the model connection step", "Click 'Allow' to find devices on local networks", "Click the 'Connect Device' button in the center", "Click the small 'I have an API key' button in the lower right"], "answer": 3, "rationale": "The slide explicitly instructs the user to 'Click the small \u201cI have an API key\u201d button in the lower right' after being asked to 'Connect a model'.", "source_chunk_id": "hermes-agent-installation-guide-2026-v1-p4"}, {"question": "According to the installation guide, what specific action must be taken after entering the endpoint URL and port number to finalize the connection?", "options": ["Click the 'Connect' button to proceed to the completion screen", "Type 'hi' in the input box to verify the installation", "Enter the API key in the top right corner", "Restart the Hermes Agent service manually"], "answer": 0, "rationale": "The slide explicitly instructs that 'Once done, click Connect to arrive at this screen' after entering the details, whereas typing 'hi' is a subsequent testing step.", "source_chunk_id": "hermes-agent-installation-guide-2026-v1-p5"}, {"question": "According to the guide, what is the correct method to launch Hermes directly from the Terminal?", "options": ["Type 'start hermes' in the input box at the bottom", "Type 'hermes' at the prompt and press Enter", "Click the Windows Menu and select 'Run Hermes'", "Search for 'Hermes Agent' in the Terminal search bar"], "answer": 1, "rationale": "The slide explicitly states that you can load Hermes in the Terminal by 'simply typing hermes at the prompt and pressing Enter'.", "source_chunk_id": "hermes-agent-installation-guide-2026-v1-p11"}, {"question": "According to the guide, what is the specific command to launch the CLI version of Hermes from the Terminal?", "options": ["Type 'open hermes' at the prompt and press Return", "Type 'launch hermes' at the prompt and press Return", "Type 'start hermes-cli' at the prompt and press Return", "Type 'hermes' at the prompt and press Return"], "answer": 3, "rationale": "The slide states that you can load Hermes up in the Terminal by 'simply typing hermes at the prompt and pressing Return'.", "source_chunk_id": "hermes-agent-installation-guide-2026-v1-p6"}]}, "mbax-6418-assignment-1": {"name": "MBAX 6418 Assignment 1", "kind": "page", "questions": [{"question": "According to the slide, what is the specific requirement for submitting a private GitHub repository to ensure the instructor can access it for grading?", "options": ["Upload the code and data files directly to Canvas instead of using a GitHub link.", "Ensure the repository is set to public so that anyone with the link can read it without extra steps.", "Push the code to a public repository and then change it to private after the assignment is graded.", "Add the instructor (david.dobolyi@colorado.edu) as a collaborator on the repository before submitting the link."], "answer": 3, "rationale": "The slide states that for a private repo, you must 'add me ( david.dobolyi@colorado.edu ) as a collaborator on the repo, otherwise I can't see the files when I open it.'", "source_chunk_id": "mbax-6418-assignment-1-p6"}, {"question": "According to the slide, what is the recommended approach for determining the primary emotion of a review using a word list method?", "options": ["Sum the scores for all emotions in the NRC list and select the emotion with the highest total score.", "Filter reviews by the NRC emotion categories and count the frequency of each emotion to determine the primary one.", "Use the LLM to predict the primary emotion and compare it against the NRC word list to find the most accurate match.", "Score each review's words against the NRC emotion word list, sum the scores per emotion, and select the emotion with the highest score."], "answer": 3, "rationale": "The slide states that for the word list method, one should 'score each review's words against an NRC emotion word list... add the scores per emotion, and take the highest as the answer.'", "source_chunk_id": "mbax-6418-assignment-1-p3"}, {"question": "According to the submission requirements for the final deliverable, how should team members handle the submission of their work if they collaborated on the same project?", "options": ["Team members should share a single GitHub repository and submit one link to ensure the codebase is unified.", "Only the team leader needs to submit the GitHub repository link, while other members submit their individual reports.", "Team members must combine their individual reports into a single PDF document and upload it to the course portal instead of using GitHub.", "Each team member must submit their own separate GitHub repository, even if the content is essentially identical to their teammates' work."], "answer": 3, "rationale": "The slide explicitly states that 'each of you submits your own repository, even if it contains essentially the same project' to verify individual completion, rather than sharing one repo.", "source_chunk_id": "mbax-6418-assignment-1-p5"}, {"question": "According to Step 6, why is balanced sampling recommended over reading the first N rows in order when evaluating the three-class model?", "options": ["Reading the first N rows in order under-represents the rarer classes, whereas balanced sampling ensures a roughly equal number of samples from each class.", "Reading the first N rows in order is computationally faster, allowing for quicker dashboard updates without sacrificing accuracy.", "Balanced sampling is required because the model only performs well when trained on exactly 50 samples per class, regardless of the total dataset size.", "Reading the first N rows in order introduces layout bugs that collapse chart elements, which balanced sampling prevents by using a fixed random seed."], "answer": 0, "rationale": "The slide explicitly states that 'reading the first N rows in order under-represents the rarer classes,' which is why the instruction advises pulling a balanced group with a roughly equal number from each class.", "source_chunk_id": "mbax-6418-assignment-1-p4"}, {"question": "According to the instructions for Step 2, how is the 'correct answer' for sentiment classification determined from the dataset's rating field?", "options": ["A review is classified as positive if the helpful_vote count is high, regardless of the rating.", "A review is classified as positive if the rating is 4 or higher, and negative if it is less than 4.", "A review is classified as positive if the rating is 5, and negative if it is 1, 2, 3, or 4.", "A review is classified as positive if the rating is greater than 4, and negative otherwise."], "answer": 1, "rationale": "The slide explicitly states that the correct answer is worked out from the rating by defining a review as positive if the rating is '\u22654' (greater than or equal to 4) and negative otherwise.", "source_chunk_id": "mbax-6418-assignment-1-p2"}, {"question": "According to the slide, what is the primary reason for making results repeatable by using a fixed seed and fixed settings?", "options": ["To hide the imbalance in the data so the model appears more effective than it is.", "So that running the process again yields the same answer, ensuring the published numbers are verifiable.", "To ensure the dashboard looks like a finished, cohesive product.", "Because the model needs to see the rating to generate consistent outputs."], "answer": 1, "rationale": "The slide states that results should be repeatable so that 'running it again gives the same answer,' ensuring that any published number comes from a fixed choice of reviews and settings.", "source_chunk_id": "mbax-6418-assignment-1-p7"}]}}};
const SOURCES = {"w2-s20": {"title": "Sycophancy", "text": "Sycophancy\nBe careful with models that are overly \u201cagreeable\u201d\nModels are measured in terms of alignment to address this concern (e.g., Claude Sonnet 4.5)\nConsider benchmarks such as SycEval (Fanous et al. 2025)", "loc": "Week 2, slide 20", "section": null, "images": ["data/media/week02/s20/image22.jpg"]}, "w2-s42": {"title": "Model Context Protocol (MCP)", "text": "Model Context Protocol (MCP)\nAn open standard for interfaces to access add-ons like:\nTools\nData (including databases)\nAPIs\nSome popular MCPs for vibe coding:\nContext7 for up-to-date coding documentation\nPlaywright MCP or Chrome DevTools for browser automation\nComfy MCP for image/video/audio/3D generation\nSee the MCP Market Leaderboard for more", "loc": "Week 2, slide 42", "section": null, "images": []}, "w2-s22": {"title": "Popular Open Coding Models (Aug 2026)", "text": "Popular Open Coding Models (Aug 2026)\n*Plus 51B n-gram embedding (and 4B MTP)\n\u2020Can be extended via methods such as YaRN, RoPE", "loc": "Week 2, slide 22", "section": null, "images": []}, "w2-s13": {"title": "Speculative Decoding", "text": "Speculative Decoding\nSpeculative decoding is a method of \u201cguessing\u201d several upcoming candidate tokens (e.g., 3 tokens ahead) that are verified by the model in a single pass to improve throughput\nSome methods under this umbrella such as multi-token prediction (MTP) are built into models (e.g., Qwen3.8)\nOthers such as DSpark, DFlash, and DFlash 2 involve a separate drafter model that works in conjunction with a larger model\nBenchmarking speculative decoding at a variety of output (i.e., 3 vs. 5 tokens) and context lengths is important, as longer lengths can hinder speedup (also see Adaptive MTP)", "loc": "Week 2, slide 13", "section": null, "images": ["data/media/week02/s13/image21.png"]}, "w2-s19": {"title": "Other Model Considerations", "text": "Other Model Considerations\nMultimodal\nSome models work with modalities beyond text, e.g., vision, audio\nThese vision-language models (VLMs) may include \u201cVL\u201d or \u201cV\u201d in the model\u2019s name\nThinking/Reasoning\nSome models simulate cognitive processing (e.g., chain-of-thought [CoT]) for internal planning, often allowing for better response quality\nTool Calling/Tool Use/Agentic\nSome models advertise \u201cagentic\u201d abilities, which include setting goals, planning, and acting while using \u201ctools\u201d to complete tasks", "loc": "Week 2, slide 19", "section": null, "images": ["data/media/week02/s19/image21.png"]}, "w2-s11": {"title": "KV Caching", "text": "KV Caching\nA single LLM response can involve a sequence of many inference passes (e.g., once per every output token in the response)\nBy using a key-value (KV) cache, decoding can move faster by avoiding the need to reprocess prior tokens when generating new ones, reducing TTFT\nThe tradeoff of KV cache is increased memory demands", "loc": "Week 2, slide 11", "section": null, "images": []}, "w3-s16": {"title": "Markdown", "text": "Markdown\nPrompts are often written in Markdown format (created by John Gruber in 2004) to help provide text-based structure that LLMs understand\nVarious cheat sheets and guides exist that can help with basic syntax\nMarkdown files use the .md extension\nSource:\u00a0Markdown Guide, Matt Cone,\u00a0CC BY-SA 4.0", "loc": "Week 3, slide 16", "section": null, "images": ["data/media/week03/s16/image7.jpg"]}, "w3-s4": {"title": "Prompts", "text": "Prompts\nPrompts consist of text and/or multimodal content (e.g., images, audio, video) provided to a model to guide its behavior and outputs\nFor example, a user prompt to Hermes Agent might be as simple as: \u201cWhat is a prompt?\u201d", "loc": "Week 3, slide 4", "section": null, "images": []}, "w3-s32": {"title": "Hermes Learns from and Remembers You", "text": "Hermes Learns from and Remembers You\nAs you use Hermes, it will start making notes about you via persistent memory files, including:\nMEMORY.md \u2013 Agent\u2019s personal notes, including environment facts, conventions, things learned\nUSER.md \u2013 User profile, including your preferences, communication style, expectations\nHermes comes with out-of-the-box skills to help solve tasks, but it can also learn new ones as you work with it (automatically or manually):\n/skills \u2013 Search, install, inspect, or manage skills\n/learn \u2013 Learn a reusable skill from anything you describe", "loc": "Week 3, slide 32", "section": null, "images": ["data/media/week03/s32/image4.png"]}, "w3-s29": {"title": "Hermes Agent Commands", "text": "Hermes Agent Commands\nBeyond just typing prompts, Hermes provides several commands to help manage more complex tasks, including:\n/prompt \u2013 Compose your next prompt in $EDITOR (markdown), then send it (aka /compose)\n/queue \u2013 Queue a prompt for the next turn (doesn\u2019t interrupt)\n/steer \u2013 Inject a message after the next tool call without interrupting\n/goal \u2013 Set a standing goal Hermes works on until achieved\n/subgoal \u2013 Add or manage extra criteria on the active goal\n/plan \u2013 Write a markdown implementation plan\u2026without executing anything\n/kanban \u2013 Multi-profile collaboration board (tasks, links, comments)\nThe following slides present key summaries from pg. 14 of Lee & Palmer (2025)", "loc": "Week 3, slide 29", "section": null, "images": ["data/media/week03/s29/image4.png"]}, "w3-s24": {"title": "Prompting Complex Tasks (e.g., Coding)", "text": "Prompting Complex Tasks (e.g., Coding)\nSuccessfully accomplishing a complex task like coding requires step-by-step instruction (e.g., numbered lists)\nSteps should be sequential\nWhile multiple aspects can be worked in a single prompt, they may interfere with each other if they are not independent\nA single, giant prompt can lead to missed or skipped steps\nBe precise and do your research beforehand, e.g.,\nWhat language do you want to code in?\nWhat packages do you want to use?", "loc": "Week 3, slide 24", "section": null, "images": ["data/media/week03/s24/image4.png"]}, "w3-s17": {"title": "Research on Prompt Engineering", "text": "Research on Prompt Engineering\nThere are many rules-of-thumb regarding how prompts should be engineered, although outcomes often vary by task and setting\nFor a recent literature review regarding prompt engineering from an educational perspective, see:\nPrompt engineering in higher education: a systematic review to help inform curricula (Lee & Palmer 2025)", "loc": "Week 3, slide 17", "section": null, "images": []}, "w4-s12": {"title": "OpenAI-Compatible Endpoints", "text": "OpenAI-Compatible Endpoints\nThe OpenAI Python API library is designed to work with OpenAI models, but you can also use it to talk to OpenAI-compatible endpoints\nThese endpoints communicate the same way as the official OpenAI API Platform, but can be hosted elsewhere\nFor example, we are already using a free, OpenAI-compatible endpoint for our class LLM (served via vLLM):\nBase URL: http://dobolyi.com:9000/v1\nAPI Key: 6418\nModel Name: DeepSeek-V4-Flash-0731", "loc": "Week 4, slide 12", "section": null, "images": ["data/media/week04/s12/image4.png"]}, "w4-s24": {"title": "Hermes and GitHub", "text": "Hermes and GitHub\nIf you ask it to (e.g., \u201cLet\u2019s use GitHub for version control\u201d), Hermes will take care of Git/GitHub on your behalf, including common commands:\ngit init \u2013 create a new local repository\ngit clone \u2013 copy an existing repository to your computer\ngit status \u2013 show local changes and what\u2019s ready to commit\ngit add \u2013 select changes to include in the next commit\ngit commit \u2013 record selected changes as a checkpoint\ngit push \u2013 send commits to a remote repository, e.g., GitHub\ngit revert \u2013 create a new commit that reverses a previous commit\ngit pull \u2013 retrieve/incorporate remote changes to your local copy\ngit diff \u2013 compare changes between file versions", "loc": "Week 4, slide 24", "section": null, "images": ["data/media/week04/s24/image4.png"]}, "w4-s5": {"title": "Choosing an Interface", "text": "Choosing an Interface\nWe have many interface options, but for Python, Gradio and Streamlit are good, high abstraction options (i.e., they handle many of the technical details for us)", "loc": "Week 4, slide 5", "section": null, "images": ["data/media/week04/s05/image4.png", "data/media/week04/s05/image6.jpg"]}, "w4-s6": {"title": "Components and Widgets", "text": "Components and Widgets\nGradio and Streamlit provide prebuilt user interface (UI) elements (e.g., buttons, sliders, and text inputs) to help you quickly build interactive Python apps:\nGradio Components\nStreamlit Elements/Widgets", "loc": "Week 4, slide 6", "section": null, "images": ["data/media/week04/s06/image4.png", "data/media/week04/s06/image7.jpg"]}, "w4-s18": {"title": "Bugs and Bug Reports", "text": "Bugs and Bug Reports\nWhile you build and test your app, your code will invariably contain bugs, which are errors in the software that cause it to fail or not work as intended\nTo fix bugs, you need to create a thorough bug report, which helps document, reproduce, and ultimately fix each issue\nWarning! Just because an agent says a bug was fixed doesn\u2019t mean it\u2019s true! You must check!", "loc": "Week 4, slide 18", "section": null, "images": ["data/media/week04/s18/image16.png", "data/media/week04/s18/image4.png"]}, "w4-s4": {"title": "Building", "text": "Building\nLet\u2019s create a small web app, add features (including one with AI), and share it\nWe\u2019ll also commit it to GitHub for version control\nStarter prompt:\n\u201cbuild a python app using gradio for a pizza ordering website where customers can customize their pizzas with things like toppings, size, crust, etc.\u201d\nMade with Hermes Agent and GPT-6 Astra", "loc": "Week 4, slide 4", "section": null, "images": ["data/media/week04/s04/image4.png", "data/media/week04/s04/image5.jpg"]}, "w5-s15": {"title": "Semantic Search and Embeddings", "text": "Semantic Search and Embeddings\nRAG often uses semantic search, or search based on meaning, to retrieve info relevant to the user\u2019s question\nSemantic search typically uses embeddings to numerically represent text, images, and other data\nEmbeddings are like coordinatesin high-dimensional space: similar items tend to lie closer together\nVector search compares the question\u2019s embedding with data embeddings to find potential matches", "loc": "Week 5, slide 15", "section": null, "images": ["data/media/week05/s15/image15.png", "data/media/week05/s15/image4.png"]}, "w5-s13": {"title": "Context Optimization", "text": "Context Optimization\nRAG optimizes context by supplying relevant information when the model responds\nFine-tuning adapts the model itself through additional training\u2014a topic we\u2019ll cover later", "loc": "Week 5, slide 13", "section": null, "images": ["data/media/week05/s13/image14.png", "data/media/week05/s13/image4.png"]}, "w5-s18": {"title": "Hybrid RAG Pipeline with Reranking", "text": "Hybrid RAG Pipeline with Reranking\nRAG uses information from prepared documents to help an LLM answer the user\u2019s question\nRetrieval finds relevant candidate chunks using both keyword search and vector search in Hybrid RAG\nReranking compares these candidates to the original question and prioritizes which chunks are supplied to the LLM as context", "loc": "Week 5, slide 18", "section": null, "images": ["data/media/week05/s18/image4.png"]}, "w5-s16": {"title": "Preparing Documents (Docs) for Search", "text": "Preparing Documents (Docs) for Search\nDocs added or updated in the RAG corpus must be prepared for search\nParsing extracts text and structure from each doc\nChunking divides the parsed content of each doc into useful passages while preserving source metadata (e.g., doc name, page number)\nIndexing prepares the chunked passages for both:\nKeyword (lexical) search to find chunks containing matching words\nVector search, which uses embeddings to find chunks with similar meanings", "loc": "Week 5, slide 16", "section": null, "images": ["data/media/week05/s16/image4.png"]}, "w5-s2": {"title": "Context Engineering", "text": "Context Engineering\nRetrieval Augmented Generation (RAG)\nBuilding a RAG System\nClass Exercise\n2\nTopics", "loc": "Week 5, slide 2", "section": null, "images": []}, "w5-s17": {"title": "Each chunk should contain just enough context to be useful in isolation", "text": "Each chunk should contain just enough context to be useful in isolation\nCommon chunking strategies:\nFixed size \u2013 chunks with a set size, often with overlap\nRecursive \u2013 split at boundaries like paragraphs, then divide oversized chunks at finer boundaries like sentences\nDocument-based \u2013 keep related information together based on structural boundaries such as headings (see example above)\nSemantic \u2013 split based on changing topics or meanings\nChunking: How Much Context Is Enough?", "loc": "Week 5, slide 17", "section": null, "images": ["data/media/week05/s17/image4.png"]}, "w6-s10": {"title": "Speech to Text", "text": "Speech to Text\nAutomatic speech recognition (ASR) converts spoken audio into written text\nWhisper large-v3-turbo supports multilingual transcription and segment timestamps, indicating when each passage occurs\nSpeaker diarization labels who spoke when (e.g., \u201cSpeaker 1\u201d vs. \u201cSpeaker 2\u201d), using models like NVIDIA Nemotron-3-Diarization", "loc": "Week 6, slide 10", "section": null, "images": ["data/media/week06/s10/image4.png", "data/media/week06/s10/image6.jpg"]}, "w6-s6": {"title": "What Goes In vs. What Comes Out", "text": "What Goes In vs. What Comes Out\nA modality is a type of content, e.g., text, image, audio, and/or video\nA multimodal model works with multiple modalities across inputs, outputs, or both\nA vision-language model (VLM) works with both visual content and language (e.g., describe this picture)\nA multimodal large language model (MLLM) is a broader term for an LLM that works beyond text (i.e., many modern VLMs are also MLLMs)\nDifferent models support different input \u2192 output combinations\nVisual understanding: receipt image + \u201cThe total?\u201d \u2192 text answer\nTranscription: speech recording \u2192 text transcript\nImage generation: text description \u2192 generated image", "loc": "Week 6, slide 6", "section": null, "images": ["data/media/week06/s06/image4.png"]}, "w6-s19": {"title": "Weights and Serving", "text": "Weights and Serving\nCheck permissions for commercial use, self-hosting, and redistribution\nProvider-hosted APIs have their own terms\nLook for permissive licenses such as Apache 2.0, MIT, and OpenMDW 1.1, which allow commercial use subject to their terms\nCode and weights may have different licenses: OmniVoice has Apache 2.0 code but noncommercial weights (CC-BY-NC)\nGeographic restrictions may apply: MiniMax H3\u2019s community license excludes the US, but users can apply for a separate license\nWith all this in mind: What are you allowed to do with the content a model generates?", "loc": "Week 6, slide 19", "section": null, "images": ["data/media/week06/s19/image4.png"]}, "w6-s18": {"title": "Open-Weight / Closed Models (Sep 2026)", "text": "Open-Weight / Closed Models (Sep 2026)\nOpen-weight models: deployment control, subject to licensing and hosting costs\nClosed models: managed access, with provider-set pricing and limits\nBoth allow for API access: compare quality, speed, cost, and privacy", "loc": "Week 6, slide 18", "section": null, "images": ["data/media/week06/s18/image4.png"]}, "w6-s16": {"title": "Generating Video", "text": "Generating Video\nModels like MiniMax H3 use DiTs to generate video with synchronized sound\nText-to-video prompts describe scenes, actions, and camera movement\nImage-to-video uses a first frame, last frame, or both to guide generation\nReference-to-video uses images, video, or audio to guide, edit, or extend clips\nTemporal consistency, or keeping appearance and motion coherent across frames, is an ongoing challenge\nRef. Video\nGenerated Video\nRef. Image\nRef. Audio", "loc": "Week 6, slide 16", "section": null, "images": ["data/media/week06/s16/image12.jpg", "data/media/week06/s16/image13.jpg", "data/media/week06/s16/image14.jpg", "data/media/week06/s16/image4.png", "data/media/week06/s16/image8.png"]}, "w6-s13": {"title": "Generating and Editing Images", "text": "Generating and Editing Images\nDiffusion Transformers (DiTs) and related methods turn noise into images, guided by prompts that specify the subject, setting, lighting, and composition\nModels like FLUX.2-klein-4B support text-to-image generation from descriptions and image-to-image editing through instructions\nReference images guide a person\u2019s appearance, product details, or visual style\nSome models offer inpainting to modify masked areas, outpainting to extend an image, and negative prompts to describe what to avoid", "loc": "Week 6, slide 13", "section": null, "images": ["data/media/week06/s13/image4.png"]}, "hermes-agent-installation-guide-2026-v1-p9": {"title": "Page 9", "text": "When the installation finishes, you will see the following screen:\nClick LAUNCH to proceed. You will need to wait briefly for Hermes to\nload:\nEventually, you will be asked to \u201cConnect a model...\u201d:", "loc": "Hermes Agent Installation Guide 2026 v1, page 9", "section": null, "images": ["data/media/hermes-agent-installation-guide-2026-v1/p009.jpg"]}, "hermes-agent-installation-guide-2026-v1-p8": {"title": "Page 8", "text": "Windows Installation Instructions\nDownload and open the latest version of Hermes Desktop here:\nhttps://hermes-assets.nousresearch.com/Hermes-Setup.exe\nOpen the executable you downloaded to begin the installation process:\nClick INSTALL to begin the installation process. On the installation\nscreen, wait for Hermes to complete all the installation steps (this\nmay take several minutes). You may be prompted by User Account Control\n(UAC) to answer a question such as: \u201cDo you want to allow this app\nfrom an unknown publisher to make changes to your device?\u201d \u2013 if so,\nanswer Yes (e.g., for cua-driver.exe, which allows Hermes to control\napplications on your computer on your behalf). Be aware that there is\na known issue with the installer at time of writing (2026/08/19) where\nthe some steps may take 10 minutes to complete \u2013 the temporary fix is\nto patiently wait it out.", "loc": "Hermes Agent Installation Guide 2026 v1, page 8", "section": null, "images": ["data/media/hermes-agent-installation-guide-2026-v1/p008.jpg"]}, "hermes-agent-installation-guide-2026-v1-p4": {"title": "Page 4", "text": "In the meantime, you may be asked if you want to \u201cAllow \u2018Hermes\u2019 to\nfind devices on your local networks?\u201d \u2013 click Allow:\nBack on Hermes, you will be asked to \u201cConnect a model...\u201d:\nClick the small \u201cI have an API key\u201d button in the lower right to\narrive at this screen:", "loc": "Hermes Agent Installation Guide 2026 v1, page 4", "section": null, "images": ["data/media/hermes-agent-installation-guide-2026-v1/p004.jpg"]}, "hermes-agent-installation-guide-2026-v1-p5": {"title": "Page 5", "text": "As shown in the screenshot above, select \u201cLocal / custom endpoint\u201d and\nenter the following details in the two boxes at the bottom:\nhttp://dobolyi.com:9000/v1\n6418\nOnce done, click Connect to arrive at this screen:\nYour installation is now complete. Test it by typing \u201chi\u201d in the input\nbox at the bottom (after a few moments, you should see a response\nsimilar to what\u2019s shown below):", "loc": "Hermes Agent Installation Guide 2026 v1, page 5", "section": null, "images": ["data/media/hermes-agent-installation-guide-2026-v1/p005.jpg"]}, "hermes-agent-installation-guide-2026-v1-p11": {"title": "Page 11", "text": "Your installation is now complete. Test it by typing \u201chi\u201d in the input\nbox at the bottom (after a few moments, you should see a response\nsimilar to what\u2019s shown below):\nYou can now also load Hermes up in the Terminal (Windows Menu ->\nSearch -> Terminal) by simply typing hermes at the prompt and pressing\nEnter:", "loc": "Hermes Agent Installation Guide 2026 v1, page 11", "section": null, "images": ["data/media/hermes-agent-installation-guide-2026-v1/p011.jpg"]}, "hermes-agent-installation-guide-2026-v1-p6": {"title": "Page 6", "text": "You can now also load Hermes up in the Terminal (found in Applications\n-> Utilities -> Terminal) by simply typing hermes at the prompt and\npressing Return:\nDoing so will pull up the CLI version of Hermes:", "loc": "Hermes Agent Installation Guide 2026 v1, page 6", "section": null, "images": ["data/media/hermes-agent-installation-guide-2026-v1/p006.jpg"]}, "mbax-6418-assignment-1-p6": {"title": "Page 6", "text": "GitHub access works for every person in the class, not just one or two per group. If a teammate\npushes and everyone else just forwards the same link, only that teammate's account has\nproven GitHub works.\nPublic or private? Public is the simplest default \u2014 anyone with the link can read it, no extra\nsteps. Private works too, but it costs you one small step: add me\n( david.dobolyi@colorado.edu ) as a collaborator on the repo, otherwise I can't see the files\nwhen I open it. Do that after you create the repo, before you hand in the link.\nWhere to submit the link. The repo link is handed in as the assignment submission on\nCanvas \u2014 put the shareable GitHub link in the Canvas submission so it's tied to your account\nthere. Just make sure the link you paste works (see the check further down) before you hit\nsubmit.\nNew to GitHub? That's expected and fine \u2014 you'll likely need to create an account. Sign up\nhere if you don't have one:\nhttps://github.com/signup\nBecause you're all students, the GitHub Student Developer Pack gives you free access to\ntools that normally cost money \u2014 including GitHub Pro, Copilot, and Codespaces credits \u2014\nplus bundled tutorials for getting started with git and open source:\nhttps://education.github.com/pack\nThe agent can and should help with every step. It can't sign up for you (only you can), but it\ncan:\nguide you through account creation and the one-time setup (creating a token /\nauthenticating git ),\ninitialize a repository in your project folder,\nstage and commit your code and the report,\ncreate the GitHub repository and push to it,\nfor a private repo, invite me ( david.dobolyi@colorado.edu ) as a collaborator,\ntell you how to confirm it's accessible and grab the shareable link.\nBefore you push, be deliberate about what goes in: include the code and the README.md ; think\nabout whether the data file (which is large and re-downloadable) or any credentials/tokens\nbelong in the repo \u2014 generally they don't. Ask the agent if you're unsure what's safe to commit.\nAsk yourself: does the link you submit open a repository that you can access, and would the\nperson grading it be able to too \u2014 a public repo readably, or a private one after you've invited", "loc": "MBAX 6418 Assignment 1, page 6", "section": null, "images": ["data/media/mbax-6418-assignment-1/p006.jpg"]}, "mbax-6418-assignment-1-p3": {"title": "Page 3", "text": "Ask yourself: can you say, with evidence, what the model is good and bad at? Keep in mind\nthe data is heavily skewed toward high ratings \u2014 most reviews are \u2605\u2605\u2605\u2605 or \u2605\u2605\u2605\u2605\u2605 \u2014\nand don't let that lopsidedness fool you into thinking the model is better than it is.\nStep 3 \u2014 A results dashboard\nPresent the results in a visual dashboard. A single self-contained HTML page is a good\noption \u2014 everything baked into one file, works offline, no server or network needed \u2014 but\nyou're not limited to it: interactive app frameworks like Streamlit and Gradio work just as well.\nDecide what belongs in it; at minimum the headline numbers, a clear picture of which answers\nwere right and wrong and how mistakes cluster by class, and enough per-review detail to back\nup what you claim.\nDesign bar: this is a product, not a demo. Deliberate palette, refined typography, a coherent\ntheme the host can recolor \u2014 no library-shuffle look.\nAsk yourself: do the numbers on the page match what your scoring produced, and can a non-\ntechnical reader tell at a glance how good the model is?\nStep 4 \u2014 Interactive review filtering\nMake the review table explorable: let a reader filter to a subset (e.g., correct vs mismatched)\nwith a live count. Whether you do more than that is up to you.\nAsk yourself: does filtering show exactly the rows you asked for, and does the count make\nsense with what you recorded?\nStep 5 \u2014 Primary-emotion detection\nAdd two independent takes on the review's primary emotion:\n1. The LLM predicts it \u2014 extend the prompt's output so each review gives both sentiment\nand a primary emotion.\n2. A word list derives it \u2014 score each review's words against an NRC emotion word list (a\npublic list linking words to emotions: anger, anticipation, disgust, fear, joy, sadness, surprise,\ntrust), add the scores per emotion, and take the highest as the answer. This needs no\nmodel calls and runs over your existing predictions.", "loc": "MBAX 6418 Assignment 1, page 3", "section": null, "images": ["data/media/mbax-6418-assignment-1/p003.jpg"]}, "mbax-6418-assignment-1-p5": {"title": "Page 5", "text": "Final deliverables\nProduce a short report plus the working files: the prompt, the scoring script that runs the\nreviews, the word-list script that adds the emotions, the dashboard generator, one balanced\nrun's raw output, and the final dashboard.\nReport format: write it as markdown in a README.md (so it can later drop into a GitHub\nrepository as-is), and include one or more screenshots of at least the interface (for example,\na capture of the dashboard you built). Make sure every number you quote in it matches a visible\nfigure in the saved output. Also cite the source of the data (the Amazon Reviews '23 dataset\nand its page) inside the README \u2014 don't expect a reader to go hunting for where the reviews\ncame from.\nThe report should be able to answer, with evidence:\n1. Why did the lopsided run look very accurate, and what did sampling equal amounts of each\nclass change?\n2. Look at where the model's mistakes go \u2014 which classes get confused with which, and in\nwhat direction? (For example, do \u2605\u2605\u2605 (i.e., 3-star neutral) reviews get labeled negative,\nor do negative ones get called neutral?) Report the concrete numbers from your matrix.\n3. How do the LLM's emotions and the word list's emotions differ, and why?\n4. What bugs and/or issues did you hit along the way \u2014 in the charts, the UI, in the process of\nworking with the agent, or anywhere else \u2014 and how did you work around them?\nAuthor / review split: the report should be generated with the agent (it produces the draft,\npulls the numbers from the saved output, writes the narrative), but it is your deliverable \u2014\nreview and check it yourself before submitting. Checking the claimed numbers against the\nsaved output and putting the agent's framing and conclusions into your own words is part of the\nassignment, not an optional pass.\nSubmission: publish to GitHub and share the link\nRequirement: the final README.md report and all the project code must live in a GitHub\nrepository, and you must hand in a shareable link to it. There is no alternative submission\npath \u2014 the repo is the submission.\nOne per person, even in a team. If you work with classmates on the same work, you don't all\nshare one repo and one hand-in \u2014 each of you submits your own repository, even if it\ncontains essentially the same project. That requirement is there on purpose: it verifies that", "loc": "MBAX 6418 Assignment 1, page 5", "section": null, "images": ["data/media/mbax-6418-assignment-1/p005.jpg"]}, "mbax-6418-assignment-1-p4": {"title": "Page 4", "text": "Keep both, and compare them.\nAsk yourself: how often do the two agree, and where/why do they diverge?\nStep 6 \u2014 Three-class scoring with balanced sampling\nRedefine to the full split:\nRating Class\n4\u20135 POSITIVE\n3 NEUTRAL\n1\u20132 NEGATIVE\nCarry the change through everything \u2014 the correct answer you work out, the numbers you\ntrack, the prompt, and how the dashboard shows it. Because reading the first N rows in order\nunder-represents the rarer classes, instead pull a balanced group from the whole file \u2014 a\nroughly equal number from each class, picked with a fixed random seed so the same set\ncomes up every time \u2014 around 50 per class.\nAsk yourself: what do the balanced three-class numbers actually show, and what did the\nbalanced run reveal that the imbalanced one hid? In particular, do \u2605\u2605\u2605 (3-star) reviews get\ntheir own class, or do they collapse into another?\nStep 7 \u2014 Descriptive and prediction visualizations\nGive the dashboard a descriptive layer \u2014 e.g., a star-rating distribution, a comparison of the\n\"correct answer\" versus what the model predicted for each class, and how often each class was\nanswered right. The point is to make the model's failures visible at a glance.\nTwo things to be careful about:\nCheck the numbers on the page against the numbers you saved earlier \u2014 in the browser,\nnot just by eye.\nWatch out for layout bugs that can collapse very small chart elements (e.g., bars given zero\nwidth by a label/positioning interaction).\nAsk yourself: can a reader see, without drilling in, where the model succeeds and fails?", "loc": "MBAX 6418 Assignment 1, page 4", "section": null, "images": ["data/media/mbax-6418-assignment-1/p004.jpg"]}, "mbax-6418-assignment-1-p2": {"title": "Page 2", "text": "rating \u2014 the star rating, a number in {1, 2, 3, 4, 5} (encoded as a float, e.g., 4.0 ;\nintegral values throughout this dataset).\ntitle \u2014 the short review-issue title.\ntext \u2014 the review body.\nverified_purchase \u2014 boolean, whether the reviewer actually bought the item.\nhelpful_vote \u2014 integer count of \"helpful\" votes for the review.\ntimestamp \u2014 Unix milliseconds when the review was written.\nimages \u2014 array; image references attached to the review (often empty).\nasin \u2014 the product this review is about.\nparent_asin \u2014 the product family / parent item.\nuser_id \u2014 the reviewer.\nUse your judgment about metadata worth keeping. Before building anything, confirm you can\nactually read the file.\nStep 1 \u2014 A structured prompt\nA reusable prompt that takes a review's title and text and asks an LLM (see recommended\nendpoint below) to classify it as POSITIVE or NEGATIVE. Decide the edge cases yourself\n(conflicting title/text, terse or angry short reviews); the prompt must be set up so the model\ngives you a clear, simple answer you can read back programmatically, and it must not rely on\nthe rating.\nAsk yourself: does a quick spot-check on obviously positive and negative reviews come out\nright?\nRecommended LLM endpoint:\nBase URL: http://dobolyi.com:9001/v1\nAPI Key: 6418\nModel Name: cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit\nStep 2 \u2014 Score against the rating\nScore a 100-row first batch and see how the model does against the \"correct answer\" you work\nout from the rating (\u22654 positive, else negative). The model must never see the rating \u2014 it's\nonly for checking afterwards. How you structure and save the work is up to you; at minimum, be\nable to say how often the model agrees with the rating, which reviews it gets wrong, and a feel\nfor how often it's right on each class.", "loc": "MBAX 6418 Assignment 1, page 2", "section": null, "images": ["data/media/mbax-6418-assignment-1/p002.jpg"]}, "mbax-6418-assignment-1-p7": {"title": "Page 7", "text": "them? Can they see the README (screenshots and all), and is the code there enough to\nreproduce your results?\nStanding considerations\nThe rating is the correct answer: it's what you judge the model against, but the model\nnever sees it.\nMake your results repeatable: any number you publish should come from a fixed choice\nof which reviews were used (a fixed \"seed\") and fixed settings, so running it again gives the\nsame answer.\nShow your work: every number you claim should match the saved output \u2014 don't publish\nsomething you haven't re-checked.\nBe honest about imbalance: say openly how unbalanced the data is; never let a run that's\nmostly one easy class look like proof the model is great.\nProduct bar: the dashboard is a finished, cohesive product.", "loc": "MBAX 6418 Assignment 1, page 7", "section": null, "images": ["data/media/mbax-6418-assignment-1/p007.jpg"]}};
const DOCS = [{"doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "kind": "slide", "chunks": 42}, {"doc_id": "week03", "doc": "Week 3 - Prompt Engineering v1.pptx", "kind": "slide", "chunks": 33}, {"doc_id": "week04", "doc": "Week 4 - Serving and Debugging v4.pptx", "kind": "slide", "chunks": 29}, {"doc_id": "week05", "doc": "Week 5 - Context Engineering and RAG v1.pptx", "kind": "slide", "chunks": 21}, {"doc_id": "week06", "doc": "Week 6 - Multimodal Generative AI v1.pptx", "kind": "slide", "chunks": 20}, {"doc_id": "hermes-agent-installation-guide-2026-v1", "doc": "Hermes Agent Installation Guide 2026 v1", "kind": "page", "chunks": 12}, {"doc_id": "mbax-6418-assignment-1", "doc": "MBAX 6418 Assignment 1", "kind": "page", "chunks": 7}];
const CHUNKS_FOR_GEN = [{"id": "w2-s1", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 1", "section": null, "title": "MBAX 6418LLM Fundamentals: Models, APIs, and Interfaces", "text": "MBAX 6418LLM Fundamentals: Models, APIs, and Interfaces\nDavid Dobolyi, PhD\nAssistant Professor\nStone Family Faculty Scholar\ndavid.dobolyi@colorado.edu"}, {"id": "w2-s10", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 10", "section": null, "title": "Inference Speed", "text": "Inference Speed\nModel inference is often measured relative to two phases\nThe first phase is prefill, or prompt processing, which occurs when your input tokens are processed\nTypically measured in terms of time-to-first-token (TTFT) or prefill tokens-per-second (tok/s) at various prompt lengths\nThe second phase is decode, or token generation, which involves how quickly output tokens are generated\nTypically measured in tokens-per-second (tok/s)\nThese metrics are generally not linear and vary based on factors such as context length"}, {"id": "w2-s11", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 11", "section": null, "title": "KV Caching", "text": "KV Caching\nA single LLM response can involve a sequence of many inference passes (e.g., once per every output token in the response)\nBy using a key-value (KV) cache, decoding can move faster by avoiding the need to reprocess prior tokens when generating new ones, reducing TTFT\nThe tradeoff of KV cache is increased memory demands"}, {"id": "w2-s12", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 12", "section": null, "title": "Prompt Caching", "text": "Prompt Caching\nPrompt (or prefix) caching extends this performance boost by allowing KV cache to be reused across requests\nFor example, consider a long agentic session involving a ten messages with 100K tokens in use. The user is about to send their eleventh message of 1K tokens:\nWithout prefix caching, the model must prefill the full 101K tokens before beginning generation\nWith prefix caching, the model can reuse the KV cache for the previous 100K tokens and process only the new 1K tokens, leading to significantly lower TTFT"}, {"id": "w2-s13", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 13", "section": null, "title": "Speculative Decoding", "text": "Speculative Decoding\nSpeculative decoding is a method of \u201cguessing\u201d several upcoming candidate tokens (e.g., 3 tokens ahead) that are verified by the model in a single pass to improve throughput\nSome methods under this umbrella such as multi-token prediction (MTP) are built into models (e.g., Qwen3.8)\nOthers such as DSpark, DFlash, and DFlash 2 involve a separate drafter model that works in conjunction with a larger model\nBenchmarking speculative decoding at a variety of output (i.e., 3 vs. 5 tokens) and context lengths is important, as longer lengths can hinder speedup (also see Adaptive MTP)"}, {"id": "w2-s14", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 14", "section": null, "title": "Concurrency", "text": "Concurrency\nConcurrency involves processing multiple prompts/requests simultaneously to increase computational efficiency\nCan be combined with continuous batching, where multiple requests are strategically combined into a single execution step, to further improve performance"}, {"id": "w2-s15", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 15", "section": null, "title": "Quantization", "text": "Quantization\nQuantization is a process for scaling and rounding model parameters to make models smaller and potentially faster\nMany models are trained at 16-bit precision (e.g., FP16, BF16), but this can be reduced to 8-bits (e.g., FP8) or 4-bits (e.g., INT4) without significant accuracy degradation\nFor example, consider Qwen3-Coder-30B-A3B-Instruct\n16-bits: ~61GB; 8-bits: ~31GB; 4-bits: ~17GB\nQuantization can also be applied to model context (e.g., TurboQuant), although this can lead to output quality degradation (particularly below FP8) or a performance hit"}, {"id": "w2-s16", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 16", "section": null, "title": "Quantization Formats", "text": "Quantization Formats\nVarious quantization formats exist to help reduce hardware requirements and improve inference performance\nUse the ones appropriate to your hardware\nPrefer 4-bit (or larger) formats\nPopular options (mid 2026)\nGPU: AWQ, GPTQ, NVFP4, FP8\nApple M chips: MLX, oQ+\nCPU+GPU (includes Apple M chips): GGUF (e.g., Q4_K_M for 4-bits)"}, {"id": "w2-s17", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 17", "section": null, "title": "Model Types: Instruct, MoE", "text": "Model Types: Instruct, MoE\nInstruct (Instruction Tuned)\nTunes a base model to take an instruction and provide one response\nNot necessarily tuned for multi-turn \u201cchat\u201d\nMoE (Mixture of Experts)\nModel consists of several mini-models or \u201cexperts\u201d\nOnly some \u201cactive\u201d experts will respond to a particular input\nPerformance can be significantly faster (in tokens/sec) than a \u201cdense\u201d model (i.e., non-MoE)"}, {"id": "w2-s18", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 18", "section": null, "title": "Reading a Model Name", "text": "Reading a Model Name\nExample: Qwen3-Coder-30B-A3B-Instruct-FP8\nModel Family: Qwen3-Coder-30B-A3B-Instruct-FP8\nModel Variant: Qwen3-Coder-30B-A3B-Instruct-FP8\nModel Size/Type: Qwen3-Coder-30B-A3B-Instruct-FP8\n~30B Total Parameters\n~3B Active Parameters (i.e., Model is a MoE)\nModel Tuning: Qwen3-Coder-30B-A3B-Instruct-FP8\nQuantization: Qwen3-Coder-30B-A3B-Instruct-FP8\nNote that these conventions can (and do) vary\u2026"}, {"id": "w2-s19", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 19", "section": null, "title": "Other Model Considerations", "text": "Other Model Considerations\nMultimodal\nSome models work with modalities beyond text, e.g., vision, audio\nThese vision-language models (VLMs) may include \u201cVL\u201d or \u201cV\u201d in the model\u2019s name\nThinking/Reasoning\nSome models simulate cognitive processing (e.g., chain-of-thought [CoT]) for internal planning, often allowing for better response quality\nTool Calling/Tool Use/Agentic\nSome models advertise \u201cagentic\u201d abilities, which include setting goals, planning, and acting while using \u201ctools\u201d to complete tasks"}, {"id": "w2-s2", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 2", "section": null, "title": "Large Language Models (LLMs) for Coding", "text": "Large Language Models (LLMs) for Coding\nVibe Coding Overview\nVibe Coding Interfaces\n2\nTopics"}, {"id": "w2-s20", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 20", "section": null, "title": "Sycophancy", "text": "Sycophancy\nBe careful with models that are overly \u201cagreeable\u201d\nModels are measured in terms of alignment to address this concern (e.g., Claude Sonnet 4.5)\nConsider benchmarks such as SycEval (Fanous et al. 2025)"}, {"id": "w2-s21", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 21", "section": null, "title": "TLDR: How to Choose a Coding Model", "text": "TLDR: How to Choose a Coding Model\nContext is often paramount\u2026more context = better\nPrefer larger models (and higher reasoning settings), but consider tradeoffs\u2026\nPros: more intelligent; higher output quality\nCons: slower; require more hardware for local deployment; more expensive in the cloud\nAdditional considerations\u2026\nMoE models are often faster than dense models\nQuantized models offer an efficiency/accuracy tradeoff\nNot all models accept multimodal inputs, optimize for tool usage, etc."}, {"id": "w2-s22", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 22", "section": null, "title": "Popular Open Coding Models (Aug 2026)", "text": "Popular Open Coding Models (Aug 2026)\n*Plus 51B n-gram embedding (and 4B MTP)\n\u2020Can be extended via methods such as YaRN, RoPE"}, {"id": "w2-s23", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 23", "section": null, "title": "Popular Closed Coding Models (Aug 2026)", "text": "Popular Closed Coding Models (Aug 2026)\n*May be capped in the API at 272K or 872K\n\u2020Model features self-compaction with unspecified context window"}, {"id": "w2-s24", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 24", "section": null, "title": "Hardware Requirements for Running Local", "text": "Hardware Requirements for Running Local\nVideo memory (e.g., VRAM) and/or (ideally unified) system memory (RAM) dictate max local model size\nYou can run small models at 16GB, but more = better\nPrice-to-performance hardware options (mid 2026)\nApple M chips (e.g., MacBook Pro M5 Max 128GB; Mac Studio M5 Ultra 512GB)\nAMD Ryzen AI Max+ PRO 495 192GB\nNVIDIA RTX Pro 6000 Blackwell 96GB\nNVIDIA RTX Spark, DGX Spark 128GB"}, {"id": "w2-s25", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 25", "section": null, "title": "Enterprise Deployment", "text": "Enterprise Deployment\nFor larger scale deployment, consider servers with multiple graphical processing units (GPUs)\nFor inference, there are many viable options from AMD, NVIDIA, Intel, etc.\nMoreover, Application-Specific Integrated Circuits (ASICs) are becoming popular for their high performance-per-watt characteristics (e.g., OpenAI Jalape\u00f1o with Broadcom)\nIf training or fine-tuning matters, NVIDIA\u2019s Compute Unified Device Architecture (CUDA) is currently unparalleled"}, {"id": "w2-s26", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 26", "section": null, "title": "Running Local Models", "text": "Running Local Models\nBest choice for efficient inferencing depends on hardware\nRecommendations for most users:\nGraphical User Interfaces (GUIs): LM Studio, Ollama*\nRecommendations for technical users:\nGPU: vLLM, SGLang\nApple M chips: oMLX, MTPLX, mlx-serve\nCPU, CPU+GPU\u2020: llama.cpp, KTransformers\n*See slide notes on how to configure default context length limits\n\u2020CPU+GPU offloading can increase hardware flexibility, albeit with a performance tradeoff"}, {"id": "w2-s27", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 27", "section": null, "title": "Vibe Coding Overview", "text": "Vibe Coding Overview"}, {"id": "w2-s28", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 28", "section": null, "title": "LLMs Changed Things\u2026Forever?", "text": "LLMs Changed Things\u2026Forever?"}, {"id": "w2-s29", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 29", "section": null, "title": "Vibe Coding", "text": "Vibe Coding"}, {"id": "w2-s3", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 3", "section": null, "title": "LLMs for Coding", "text": "LLMs for Coding"}, {"id": "w2-s30", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 30", "section": null, "title": "Vibe Coding vs. Agentic Coding", "text": "Vibe Coding vs. Agentic Coding\nVibe Coding\nHuman-in-the-loop\nPrompt-based\nConversational\nDesigned for intuitive ideation and creative exploration\nAgentic Coding\nAutonomous\nInvolves goal-driven agents that plan, execute, test, and iterate\nMinimal human input\nVibe Coding\nAgentic Coding\n(Sapkota, Roumeliotis, & Karkee 2025)"}, {"id": "w2-s31", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 31", "section": null, "title": "Iterating the Vibes", "text": "Iterating the Vibes"}, {"id": "w2-s32", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 32", "section": null, "title": "Recommended Use Cases", "text": "Recommended Use Cases\nRapid prototyping\nDesigning user interfaces\nExplaining codebases\nTranslating code across languages\nPair programming"}, {"id": "w2-s33", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 33", "section": null, "title": "Vibe Coding on \u201cProd\u201d", "text": "Vibe Coding on \u201cProd\u201d"}, {"id": "w2-s34", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 34", "section": null, "title": "Security? Never heard of it\u2026", "text": "Security? Never heard of it\u2026\nHow it started\u2026\nHow it\u2019s going\u2026"}, {"id": "w2-s35", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 35", "section": null, "title": "Vibe Coding Interfaces", "text": "Vibe Coding Interfaces"}, {"id": "w2-s36", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 36", "section": null, "title": "Getting Started", "text": "Getting Started\nTo get started with vibe coding, you need to combine a model with an interface\nInterfaces come in many shapes and forms, and the choice ultimately comes down to personal preference\nCommon umbrella terms for these interfaces include:\nAI coding agents or assistants\nAgentic coding tools\nAgent harness\nThis section covers a variety of options"}, {"id": "w2-s37", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 37", "section": null, "title": "Command Line Interface (CLI) Tools", "text": "Command Line Interface (CLI) Tools"}, {"id": "w2-s38", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 38", "section": null, "title": "Visual Studio Code (VSCode) Plugins", "text": "Visual Studio Code (VSCode) Plugins"}, {"id": "w2-s39", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 39", "section": null, "title": "Integrated Development Environment (IDE)", "text": "Integrated Development Environment (IDE)"}, {"id": "w2-s4", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 4", "section": null, "title": "Open- vs. Closed-Weight LLMs", "text": "Open- vs. Closed-Weight LLMs\nOpen-Weights\nFree to download\nRun locally or via cloud application programming interfaces (APIs)*\nReproducible and private (if local)\nClosed-Weights\nHigher performing frontier models\nEasier to use/deploy via interfaces and/or APIs\nVariable costs/credit allowances\n*Open and closed APIs let you send requests to an LLM service and receive model responses programmatically."}, {"id": "w2-s40", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 40", "section": null, "title": "Popular Open Interfaces (2026)", "text": "Popular Open Interfaces (2026)\nHermes Agent \u2013 \u201cThe agent that grows with you\u201d\nOpenCode \u2013 \u201cThe open source AI coding agent\u201d\nCline \u2013 \u201can AI assistant that can use your CLI aNd Editor\u201d\nKilo Code \u2013 \u201cThe open source coding agent for building with AI in VS Code, JetBrains, or the CLI.\u201d (Acquired by Anaconda)\nRoo-Code \u2013 \u201cYour AI-Powered Dev Team, Right in Your Editor\u201d (Archived 05/26; Pivot to Roomote)\nContinue \u2013 \u201cThe future of coding isn\u2019t writing more code. It\u2019s delegating the boring parts, so you can build the interesting stuff\u201d (Acquired by Cursor)"}, {"id": "w2-s41", "doc_id": "week02", "doc": "Week 2 - LLM Fundamentals v2.pptx", "loc": "Week 2, slide 41", "section": null, "title": "Popular Closed Interfaces (2026)", "text": "Popular Closed Interfaces (2026)\nCodex \u2013 \u201cYour new coding partner\u201d\nClaud
