<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBAX 6418 · Practice Quizzes</title>
<style>
/* ---------- token theme (recolor by editing :root) ---------- */
:root{
  --bg:#FAF7F0;            /* CU-buff-tinted paper */
  --fg:#1B1B1B;            /* CU black */
  --muted:#6B675E;
  --card:#FFFFFF;
  --line:#E4DECF;
  --accent:#B8994A;        /* CU gold */
  --accent-deep:#8A6D2F;
  --accent-ink:#33280C;
  --good:#2E6B3E;
  --good-bg:#E9F2EA;
  --bad:#A33B2E;
  --bad-bg:#FAEAE7;
  --radius:14px;
  --font:"Inter","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
  line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:40px 22px 80px}
.overline{font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent-deep);font-weight:700}
h1{font-size:30px;margin:6px 0 8px;letter-spacing:-.02em}
.sub{color:var(--muted);max-width:76ch;margin:0 0 26px;font-size:14.5px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 18px;min-width:120px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pbar{flex:1 1 100%;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;width:0%;background:var(--accent);transition:width .25s}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.tab{padding:8px 16px;border:1px solid var(--line);background:var(--card);
  border-radius:99px;font:600 13px var(--font);color:var(--muted);cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab.newtab{border-style:dashed;color:var(--accent-deep)}
.tab.newtab:hover{border-color:var(--accent-deep)}
.docpill{font:700 12px var(--font);color:var(--accent-deep);margin:14px 0 6px;
  text-transform:uppercase;letter-spacing:.07em}
/* question cards */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;margin:0 0 16px}
.qhead{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.qnum{font:800 13px var(--font);color:var(--accent-deep)}
.tag{font:600 11px var(--font);padding:3px 10px;border-radius:99px;background:#F1EBDC;
  color:var(--accent-deep);text-transform:uppercase;letter-spacing:.06em}
.tag.saved{display:none}
.loc{margin-left:auto;font:600 11.5px var(--font);color:var(--muted);text-align:right}
.stem{font-size:16.5px;font-weight:600;margin:0 0 14px;letter-spacing:-.01em}
.opts{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.opts label{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;
  border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14.5px;
  transition:border-color .12s, background .12s}
.opts label:hover{border-color:var(--accent)}
.opts .ltr{font-weight:800;color:var(--muted);min-width:18px}
.opts input{accent-color:var(--accent-deep);margin-top:3px}
.q.chk .opts label{pointer-events:none}
.q.chk .opts label.right{border-color:var(--good);background:var(--good-bg)}
.q.chk .opts label.right .ltr{color:var(--good)}
.q.chk .opts label.wrong{border-color:var(--bad);background:var(--bad-bg)}
.q.chk .opts label.wrong .ltr{color:var(--bad)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:700 13.5px var(--font);border:none;border-radius:10px;padding:9px 18px;
  cursor:pointer;background:var(--fg);color:#FFF}
.btn:disabled{opacity:.4;cursor:default}
.btn.plain{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.ghost{background:#F1EBDC;color:var(--accent-deep);border:1px solid transparent}
.reveal{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
.q.chk .reveal{display:block}
.verdict{font:700 13px var(--font);margin:0 0 8px}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
.rationale{font-size:14px;margin:0 0 4px}
details.source{font-size:13.5px;border:1px solid var(--line);border-radius:10px;
  background:#FBF9F3;padding:10px 14px;margin-top:10px}
details.source summary{cursor:pointer;font-weight:700;color:var(--accent-deep)}
.snippet{margin:10px 0 0;white-space:pre-wrap;color:var(--muted);font-size:13px;
  border-top:1px dashed var(--line);padding-top:10px}
/* visual evidence */
.evidence{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.evidence figure{margin:0;padding:6px;border:1px solid var(--line);border-radius:10px;
  background:#FFF}
.evidence img{display:block;max-width:300px;max-height:220px;border-radius:7px;
  cursor:zoom-in;object-fit:contain}
.evidence figcaption{font:600 10.5px var(--font);color:var(--muted);margin-top:5px;
  text-align:center;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{margin-top:34px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);
  padding-top:16px}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(20,18,12,.85);display:none;align-items:center;
  justify-content:center;z-index:60;cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-width:94vw;max-height:92vh;border-radius:8px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.lb p{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#EDE7D6;
  font:600 12px var(--font)}
/* modals */
.overlay{position:fixed;inset:0;background:rgba(27,27,27,.45);display:none;
  align-items:center;justify-content:center;z-index:50}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:16px;padding:24px 26px;width:min(540px,92vw);
  max-height:88vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.modal h2{margin:0 0 6px;font-size:18px}
.modal p{color:var(--muted);font-size:13px;margin:0 0 14px}
.modal label.chk{display:flex;gap:8px;align-items:center;font:600 13.5px var(--font);
  padding:7px 0;color:var(--fg)}
.modal input[type=text],.modal input[type=password]{width:100%;padding:11px 13px;
  border:1px solid var(--line);border-radius:10px;font:13.5px var(--font);margin-bottom:12px}
.modal input[type=checkbox]{accent-color:var(--accent-deep)}
.modal .row{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.modal .row .grow{flex:1;display:flex;gap:10px;align-items:center}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:var(--accent);width:0%;transition:width .2s}
.genlog{font:600 12px var(--font);color:var(--muted);white-space:pre-wrap;max-height:120px;
  overflow:auto}
.lbl{font-weight:700;margin:12px 0 2px;color:var(--fg);font-size:13.5px}
.hidden{display:none}
@media(max-width:600px){.wrap{padding:24px 14px 60px}h1{font-size:24px}
  .evidence img{max-width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="overline">MBAX 6418 · Study tool</div>
  <h1>Practice Quizzes</h1>
  <p class="sub" id="sub"></p>

  <div class="stats">
    <div class="stat"><b id="sDone">0/0</b><span>answered</span></div>
    <div class="stat"><b id="sRight">0</b><span>correct</span></div>
    <div class="stat"><b id="sSkipped">0</b><span>skipped</span></div>
    <div class="stat"><b id="sPct">—</b><span>accuracy</span></div>
    <div class="pbar"><i id="sBar"></i></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="deck"></div>
  <div class="actions" style="margin-top:6px">
    <button class="btn plain" id="reset">Reset progress</button>
  </div>

  <p class="foot" id="foot"></p>
</div>

<!-- lightbox -->
<div class="lb" id="lb"><img id="lbImg" alt="source image"><p id="lbCap"></p></div>

<!-- generation / key modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="genModal">
    <h2 id="genTitle">Generate a quiz</h2>
    <p id="genSub"></p>
    <div id="genForm">
      <p class="lbl">Choose course material</p>
      <div id="docPick"></div>
      <p class="lbl">Topic filter (optional)</p>
      <input type="text" id="topicIn" placeholder="e.g. quantization, RAG, embeddings — leave empty for all">
      <p class="lbl">Questions per document</p>
      <div class="row"><div class="grow">
        <input type="range" id="countIn" min="3" max="8" value="6" style="flex:1">
        <span id="countLbl" style="font:700 13px var(--font)">6</span>
      </div></div>
    </div>
    <div id="genRun" class="hidden">
      <div class="progress"><i id="genBar"></i></div>
      <div class="genlog" id="genLog"></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn ghost" id="genCancel">Cancel</button>
      <button class="btn" id="genGo">Generate</button>
    </div>
  </div>
</div>

<script>
const QUIZ = __QUIZ_DATA__;
const SOURCES = __SOURCES_DATA__;
const DOCS = __DOCS_DATA__;
const CHUNKS_FOR_GEN = __CHUNKS_DATA__;

const state = {answers:{}, checked:{}, skipped:{}};
const LS_KEY = "mbax6418-quiz-v1";
const KEY_LS = "mbax6418-chat-key";
const GEN_LS = "mbax6418-quizgen-v1";
const BANK_ID = "__bank__";
const STOP = new Set(("the a an and or of to in on for with is are was be by at it its "+
  "this that these those from as into how what why does do can you your we our i me us").split(" "));

let activeSet = BANK_ID;
let generated = {};

function load(){try{const s=localStorage.getItem(LS_KEY);if(s)Object.assign(state,JSON.parse(s));}catch(e){}}
function persist(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function loadGen(){try{generated=JSON.parse(localStorage.getItem(GEN_LS)||"{}");}catch(e){generated={};}}
function persistGen(){try{localStorage.setItem(GEN_LS,JSON.stringify(generated));}catch(e){}}
function toks(t){return (t.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(w=>!STOP.has(w));}
function qid(setId,docId,q){return setId+"|"+docId+"|"+q.question.slice(0,40);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seededShuffle(arr,rng){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function sets(){
  const list=[{id:BANK_ID,name:"Course bank"}];
  Object.keys(generated).forEach(id=>list.push({id,name:generated[id].meta.name}));
  return list;
}
function setDocs(setId){
  if(setId===BANK_ID)return QUIZ.docs;
  const d=generated[setId]&&generated[setId].docs;
  return d||{};
}
function allQuestions(setId){
  const out=[];const docs=setDocs(setId);
  for(const docId in docs)
    for(const q of docs[docId].questions)out.push({docId,q});
  return out;
}

/* ---------- rendering ---------- */
function renderTabs(){
  const tabs=document.getElementById("tabs");tabs.innerHTML="";
  sets().forEach(s=>{
    const b=document.createElement("button");
    b.className="tab"+(activeSet===s.id?" on":"");
    b.textContent=s.name;
    b.onclick=()=>{activeSet=s.id;renderTabs();renderCards();};
    tabs.appendChild(b);
  });
  const n=document.createElement("button");
  n.className="tab newtab";n.textContent="+ New quiz";
  n.onclick=openGen;tabs.appendChild(n);
}
function renderCards(){
  const deck=document.getElementById("deck");deck.innerHTML="";
  const docs=setDocs(activeSet);
  let idx=0;
  for(const docId in docs){
    const info=docs[docId];
    if(!info.questions.length)continue;
    const h=document.createElement("div");h.className="docpill";
    h.textContent=info.name+(info.kind==="page"?" · PDF":"")+" — "+info.questions.length+" questions";
    deck.appendChild(h);
    info.questions.forEach(q=>{
      idx++;
      const id=qid(activeSet,docId,q);
      const src=SOURCES[q.source_chunk_id]||{};
      const card=document.createElement("article");card.className="q";
      const head=document.createElement("div");head.className="qhead";
      const num=document.createElement("span");num.className="qnum";
      num.textContent="Q"+idx;head.appendChild(num);
      const tag=document.createElement("span");tag.className="tag";
      tag.textContent=info.name.split(" v")[0].slice(0,26);head.appendChild(tag);
      const saved=document.createElement("span");saved.className="tag saved";
      saved.textContent="✓ saved";head.appendChild(saved);
      const loc=document.createElement("span");loc.className="loc";
      loc.textContent=(src.loc||q.source_chunk_id)+(src.section?" · "+src.section:"");
      head.appendChild(loc);card.appendChild(head);

      const stem=document.createElement("p");stem.className="stem";stem.textContent=q.question;
      card.appendChild(stem);

      const ol=document.createElement("ol");ol.className="opts";
      q.options.forEach((opt,i)=>{
        const li=document.createElement("li");
        const lab=document.createElement("label");
        const inp=document.createElement("input");inp.type="radio";inp.name=id;inp.value=i;
        if(state.answers[id]===i)inp.checked=true;
        inp.addEventListener("change",()=>{
          state.answers[id]=i;persist();
          const b=card.querySelector("button.check");if(b)b.disabled=false;
        });
        const ltr=document.createElement("span");ltr.className="ltr";
        ltr.textContent=String.fromCharCode(65+i)+".";
        const txt=document.createElement("span");txt.textContent=opt;
        lab.appendChild(inp);lab.appendChild(ltr);lab.appendChild(txt);
        li.appendChild(lab);ol.appendChild(li);
      });
      card.appendChild(ol);

      const actions=document.createElement("div");actions.className="actions";
      const checkBtn=document.createElement("button");checkBtn.className="btn check";
      checkBtn.textContent=state.checked[id]?"Revealed":"Check answer";
      checkBtn.disabled=state.answers[id]===undefined||state.checked[id];
      checkBtn.onclick=()=>{state.checked[id]=true;delete state.skipped[id];persist();renderCards();};
      actions.appendChild(checkBtn);
      if(!state.checked[id]){
        const revBtn=document.createElement("button");revBtn.className="btn ghost";
        revBtn.textContent="Reveal solution";
        revBtn.onclick=()=>{state.checked[id]=true;state.skipped[id]=true;persist();renderCards();};
        actions.appendChild(revBtn);
      }
      card.appendChild(actions);

      const rev=document.createElement("div");rev.className="reveal";
      if(state.checked[id]){
        card.classList.add("chk");
        if(!state.skipped[id])saved.classList.remove("saved");
        const v=document.createElement("p");
        const right=state.answers[id]===q.answer;
        if(state.skipped[id]){
          v.className="verdict bad";
          v.textContent="Skipped — correct answer: "+String.fromCharCode(65+q.answer)+".";
        }else{
          v.className="verdict "+(right?"good":"bad");
          v.textContent=(right?"✓ Correct":"✗ Incorrect — correct answer: "+
            String.fromCharCode(65+q.answer)+".");
        }
        rev.appendChild(v);
        const r=document.createElement("p");r.className="rationale";r.textContent=q.rationale;
        rev.appendChild(r);
        const det=document.createElement("details");det.className="source";det.open=true;
        const sm=document.createElement("summary");
        sm.textContent="Source: ["+src.loc+"] "+(src.title||"");
        det.appendChild(sm);
        const snip=document.createElement("div");snip.className="snippet";
        snip.textContent=src.text||"";det.appendChild(snip);
        if(src.images&&src.images.length){
          const ev=document.createElement("div");ev.className="evidence";
          src.images.forEach(im=>{
            const fig=document.createElement("figure");
            const imEl=document.createElement("img");
            imEl.src=im;imEl.alt="source image";
            imEl.onclick=()=>openLb(im,src.loc+" — "+im.split("/").pop());
            const cap=document.createElement("figcaption");cap.textContent=im.split("/").pop();
            fig.appendChild(imEl);fig.appendChild(cap);ev.appendChild(fig);
          });
          det.appendChild(ev);
        }
        rev.appendChild(det);
      }
      card.appendChild(rev);
      deck.appendChild(card);
    });
  }
  updateStats();
}
function updateStats(){
  const all=allQuestions(activeSet),n=all.length;
  let done=0,right=0,skipped=0;
  for(const {docId,q} of all){const id=qid(activeSet,docId,q);
    if(state.checked[id]){done++;
      if(state.skipped[id])skipped++;
      else if(state.answers[id]===q.answer)right++;}}
  document.getElementById("sDone").textContent=done+"/"+n;
  document.getElementById("sRight").textContent=right;
  document.getElementById("sSkipped").textContent=skipped;
  document.getElementById("sPct").textContent=(done-skipped)?Math.round(100*right/(done-skipped))+"%":"—";
  document.getElementById("sBar").style.width=Math.round(100*done/n)+"%";
}

/* ---------- lightbox ---------- */
function openLb(src,cap){
  document.getElementById("lbImg").src=src;
  document.getElementById("lbCap").textContent=cap;
  document.getElementById("lb").classList.add("open");
}
document.getElementById("lb").onclick=()=>{document.getElementById("lb").classList.remove("open");};

/* ---------- quiz generation (mirrors scripts/generate_quiz.py) ---------- */
const GEN_SYSTEM=("You write practice multiple-choice questions for MBAX 6418, a graduate LLM course. "+
 "You are given ONE source (a lecture slide or a course document page). Write exactly one "+
 "multiple-choice question that a student who read THIS source can answer from THIS source alone "+
 "— no outside knowledge, no trivia. Ask about the source's core teaching point. Give 4 answer "+
 "options, exactly one correct, and a one-sentence rationale that quotes or paraphrases the source "+
 "fact supporting the correct answer. Distractors must be plausible but clearly wrong per the source.");
function genPrompt(chunk){
  return "SOURCE (chunk "+chunk.id+", "+chunk.loc+")\nTitle: "+chunk.title+
    "\n\n"+chunk.text+"\n\n"+
    "Return JSON exactly:\n{\"question\": string, \"options\": [4 distinct strings], "+
    "\"answer\": integer index of the correct option (0-3), \"rationale\": string, "+
    "\"source_chunk_id\": string}";
}
function validateGen(q,anchor){
  if(!q||typeof q!=="object"||Array.isArray(q))return "not an object";
  const qq=(q.question||"").trim();
  const opts=(Array.isArray(q.options)?q.options:[]).map(o=>String(o).trim());
  const ans=q.answer,rat=(q.rationale||"").trim();
  if(!qq||qq.length>320)return "question empty/too long";
  if(opts.length!==4||opts.some(o=>o.length<1))return "need 4 options";
  if(new Set(opts.map(o=>o.toLowerCase())).size!==4)return "options not distinct";
  if(typeof ans!=="number"||ans<0||ans>3||ans!==Math.floor(ans))return "bad answer index";
  if(rat.length<10)return "rationale too short";
  let sid=String(q.source_chunk_id||"").trim().toLowerCase();
  if(sid.startsWith("chunk "))sid=sid.slice(6);
  if(sid!==anchor.toLowerCase())return "source_chunk_id mismatch";
  return null;
}
async function callGen(user){
  const key=localStorage.getItem(KEY_LS);
  const r=await fetch("http://dobolyi.com:9001/v1/chat/completions",{method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
    body:JSON.stringify({model:"cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit",
      messages:[{role:"system",content:GEN_SYSTEM},{role:"user",content:user}],
      max_tokens:700,temperature:0,chat_template_kwargs:{enable_thinking:false}})});
  if(!r.ok){let m="endpoint error "+r.status;try{m=(await r.json()).detail||m}catch(e){}throw new Error(m);}
  const d=await r.json();
  const txt=(d.choices[0].message.content||"").trim();
  const m=txt.match(/\{[\s\S]*\}/);
  if(!m)throw new Error("no JSON in response");
  return JSON.parse(m[0]);
}
function shuffleAnswers(q,seed){
  const rng=mulberry32(seed);
  const order=[0,1,2,3,4];rng();
  for(let i=3;i>0;i--){const j=Math.floor(rng()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  const oldAns=q.answer;
  q.options=order.slice(0,4).map(i=>q.options[i]);
  q.answer=order.slice(0,4).indexOf(oldAns);
}

/* generation UI */
function openGen(){
  loadGen();renderGenDocs();
  document.getElementById("genForm").classList.remove("hidden");
  document.getElementById("genRun").classList.add("hidden");
  document.getElementById("genGo").disabled=false;
  document.getElementById("genTitle").textContent="Generate a quiz";
  document.getElementById("genSub").textContent=
    "Choose the material (any of the course documents), optionally narrow it with a topic, and the "+
    "assistant writes one multiple-choice question per sampled slide/page, each validated against "+
    "its source. The answer key is fixed at generation and this quiz is saved in your browser.";
  document.getElementById("overlay").classList.add("open");
}
function renderGenDocs(){
  const box=document.getElementById("docPick");box.innerHTML="";
  DOCS.forEach(d=>{
    const lab=document.createElement("label");lab.className="chk";
    const cb=document.createElement("input");cb.type="checkbox";cb.value=d.doc_id;cb.checked=true;
    const span=document.createElement("span");
    span.textContent=d.doc+" — "+d.chunks+" chunks"+(d.kind==="page"?" (PDF)":"");
    lab.appendChild(cb);lab.appendChild(span);box.appendChild(lab);
  });
}
function closeModal(){document.getElementById("overlay").classList.remove("open");}
document.getElementById("genCancel").onclick=closeModal;
document.getElementById("countIn").oninput=e=>{
  document.getElementById("countLbl").textContent=e.target.value;
};
document.getElementById("genGo").onclick=async()=>{
  if(!localStorage.getItem(KEY_LS)){
    const k=prompt("API key needed to generate quizzes (your class key — stored only in this browser):");
    if(k)localStorage.setItem(KEY_LS,k.trim());else return;
  }
  const chosen=[...document.querySelectorAll("#docPick input:checked")].map(c=>c.value);
  if(!chosen.length){alert("Pick at least one document.");return;}
  const topic=document.getElementById("topicIn").value.trim();
  const perDoc=+document.getElementById("countIn").value;
  const seed=(Date.now()%1e9)||20261009;
  let pool=CHUNKS_FOR_GEN.filter(c=>chosen.includes(c.doc_id));
  if(topic){
    const need=toks(topic);
    if(need.length)pool=pool.filter(c=>{
      const have=new Set(toks(c.title+" "+c.text));
      return need.every(t=>have.has(t));
    });
  }
  if(!pool.length){alert("No chunks match that selection/topic.");return;}
  const rng=mulberry32(seed);
  const docs={};pool.forEach(c=>{docs[c.doc_id]=docs[c.doc_id]||[];docs[c.doc_id].push(c);});
  document.getElementById("genForm").classList.add("hidden");
  document.getElementById("genRun").classList.remove("hidden");
  document.getElementById("genGo").disabled=true;
  const bar=document.getElementById("genBar"),logEl=document.getElementById("genLog");
  logEl.textContent="";
  let total=0,done=0,failed=0;
  const qsByDoc={};
  for(const docId in docs){
    const these=docs[docId];
    const pick=seededShuffle(these.slice(),rng).slice(0,perDoc);
    total+=pick.length;qsByDoc[docId]=[];
    for(const c of pick){
      let ok=null,lastErr="";
      for(let attempt=0;attempt<2&&!ok;attempt++){
        try{
          const q=await callGen(genPrompt(c));
          const err=validateGen(q,c.id);
          if(!err){q.source_chunk_id=c.id;
            shuffleAnswers(q,seed+[...q.question].reduce((a,ch)=>a+ch.charCodeAt(0),0));
            ok=q;}
          else lastErr=err;
        }catch(e){lastErr=e.message;}
      }
      if(ok)qsByDoc[docId].push(ok);else{failed++;logEl.textContent="failed "+c.id+": "+lastErr;}
      done++;bar.style.width=Math.round(100*done/total)+"%";
      await new Promise(r=>setTimeout(r,40));
    }
  }
  document.getElementById("genGo").disabled=false;
  const finalDocs={};
  Object.keys(qsByDoc).forEach(docId=>{
    if(qsByDoc[docId].length){
      const c=pool.find(x=>x.doc_id===docId);
      finalDocs[docId]={name:c.doc,kind:c.kind,questions:qsByDoc[docId]};
    }
  });
  const nq=Object.values(finalDocs).reduce((a,d)=>a+d.questions.length,0);
  if(!nq){alert("Generation produced no valid questions. Check the key/endpoint and try again.");closeModal();return;}
  const name="Quiz "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+" ("+nq+"q)";
  const id="gen-"+seed;
  generated[id]={meta:{name:name,seed:seed,perDoc:perDoc,topic:topic||null,
    generatedAt:new Date().toISOString()},docs:finalDocs};
  persistGen();closeModal();
  activeSet=id;renderTabs();renderCards();
  document.getElementById("sub").textContent=name+" generated — "+nq+" questions kept"+
    (failed?" ("+failed+" dropped after retry).":".")+" The answer key is fixed; "+
    "solutions stay hidden until you answer or click \u201cReveal solution\u201d.";
};

/* main */
document.getElementById("reset").onclick=()=>{
  localStorage.removeItem(LS_KEY);state.answers={};state.checked={};state.skipped={};
  renderCards();
};
(function init(){
  load();loadGen();
  const meta=QUIZ.meta||{};
  const total=allQuestions(BANK_ID).length;
  document.getElementById("sub").textContent=
    total+" multiple-choice questions across the course corpus (decks + PDFs) — every question "+
    "cites its exact slide/page, shows the source excerpt, and displays the source's own images "+
    "when it has them. Use \u201c+ New quiz\u201d to generate a fresh fixed-key quiz from the material "+
    "and topic of your choice. Progress is saved in this browser.";
  document.getElementById("foot").textContent=
    "Course bank: "+total+" questions generated with the class LLM endpoint ("+(meta.model||"Qwen3.6-35B")+
    "), one per sampled source, seed "+(meta.seed||"?")+". The bank is baked into this file (offline); "+
    "generated quizzes also work offline — the endpoint is only needed to create them.";
  renderTabs();renderCards();
})();
</script>
